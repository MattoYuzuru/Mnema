spring.application.name=identity-account
spring.threads.virtual.enabled=true

server.port=${PORT:8081}
# Keep the raw peer address: ClientAddresses accepts X-Forwarded-For only from
# this environment's explicit proxy CIDRs and selects the right-most untrusted hop.
server.forward-headers-strategy=none
identity.trusted-proxy-cidrs=${MNEMA_IDENTITY_TRUSTED_PROXY_CIDRS:127.0.0.0/8,::1/128}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mnema}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/identity/migration
spring.flyway.default-schema=app_identity
spring.flyway.schemas=app_identity
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

identity.issuer=${MNEMA_IDENTITY_ISSUER}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:dev}
info.release.id=${MNEMA_BUILD_ID:dev}
info.release.mode=maintenance
info.release.topology=identity-learning
info.release.runtime=identity-account
info.release.identity-boundary=unified

logging.pattern.console=ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p service=${spring.application.name} env=${APP_ENV:dev} trace_id=%X{traceId:-} span_id=%X{spanId:-} request_id=%X{requestId:-} logger=%c{1} msg=%m%n%wEx

management.endpoints.web.base-path=/api/actuator
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=app_identity.spring_session
spring.session.timeout=8h
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.deserialization.fail-on-unknown-properties=true
identity.frontend-origin=${MNEMA_IDENTITY_FRONTEND_ORIGIN:https://mnema.app}
identity.redirect-uri=${MNEMA_IDENTITY_REDIRECT_URI:https://mnema.app/auth/callback}
identity.signing.jwk-set-file=${MNEMA_IDENTITY_SIGNING_JWK_SET_FILE}
identity.signing.active-kid=${MNEMA_IDENTITY_SIGNING_ACTIVE_KID}
identity.postbox.access-key=${MNEMA_POSTBOX_ACCESS_KEY:}
identity.postbox.secret-key=${MNEMA_POSTBOX_SECRET_KEY:}
identity.postbox.endpoint=https://postbox.cloud.yandex.net/v2/email/outbound-emails
identity.avatar.endpoint=${MNEMA_AVATAR_ENDPOINT:https://storage.yandexcloud.net}
identity.avatar.region=${MNEMA_AVATAR_REGION:ru-central1}
identity.avatar.bucket=${MNEMA_AVATAR_BUCKET:mnema-avatars}
identity.avatar.access-key=${MNEMA_AVATAR_ACCESS_KEY:}
identity.avatar.secret-key=${MNEMA_AVATAR_SECRET_KEY:}
identity.avatar.allow-staging-minio-http=${MNEMA_AVATAR_ALLOW_STAGING_MINIO_HTTP:false}
identity.deletion.enabled=${MNEMA_IDENTITY_DELETION_ENABLED:false}
# Empty is inert while disabled. Enabling deletion requires an explicitly reviewed environment policy.
identity.deletion.recovery-period=${MNEMA_IDENTITY_DELETION_RECOVERY_PERIOD:}
identity.deletion.recovery-session-period=${MNEMA_IDENTITY_DELETION_RECOVERY_SESSION_PERIOD:PT5M}
identity.deletion.lease-period=${MNEMA_IDENTITY_DELETION_LEASE_PERIOD:PT2M}
identity.deletion.scan-delay=${MNEMA_IDENTITY_DELETION_SCAN_DELAY:PT1M}
identity.deletion.batch-size=${MNEMA_IDENTITY_DELETION_BATCH_SIZE:10}

spring.datasource.hikari.connection-init-sql=SET search_path TO app_identity,public

spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=10s
