spring.application.name=learning-api
spring.threads.virtual.enabled=true

server.port=${PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=native

# Fail-closed capability gates: a flag alone never enables anything without a provider implementation.
learning.features.ai-assessment.enabled=false
learning.features.speech-to-text.enabled=false
learning.features.ai-generation.enabled=false
learning.features.text-to-speech.enabled=false
learning.features.image-search.enabled=false
learning.features.image-generation.enabled=false
learning.features.video-generation.enabled=false
learning.features.web-search.enabled=false

# AI provider layer (docs/architecture/ai-generation-platform.md section 9). Secrets only through environment names.
# learning.ai.provider=stub selects the deterministic Stub for every text route (local runs and CI); empty uses the routes.
# Route entries are provider:model in order of preference; entries without credentials are skipped. Owner decision 2026-10-04: the
# fallback of the direct DeepSeek route is OpenRouter (the same DeepSeek models); GigaChat stays last for a RU-only fallback once its key exists.
learning.ai.provider=
learning.ai.routes.text-fast=deepseek:deepseek-flash,openrouter:deepseek/deepseek-v4.1-flash,gigachat:GigaChat-2
learning.ai.routes.text-strong=deepseek:deepseek-v4-pro,openrouter:deepseek/deepseek-v4-pro
learning.ai.routes.assess=deepseek:deepseek-flash,openrouter:deepseek/deepseek-v4.1-flash,gigachat:GigaChat-2
# The planner of «Сначала показать план» (AI-14): Flash class with thinking (a provider without a reasoning mode answers without it), and the escalation
# to Pro class with thinking after a plan that stayed invalid after its repair. Both routes are text-capability routes.
learning.ai.routes.plan=deepseek:deepseek-flash,openrouter:deepseek/deepseek-v4.1-flash,gigachat:GigaChat-2
learning.ai.routes.plan-strong=deepseek:deepseek-v4-pro,openrouter:deepseek/deepseek-v4-pro
# One provider attempt of the grading route may take at most this long, so that the fallback has time inside the 20 s deadline of an answer.
learning.ai.routes.assess-attempt-cap=PT8S
learning.ai.providers.deepseek.base-url=https://api.deepseek.com
learning.ai.providers.deepseek.api-key=${MNEMA_AI_DEEPSEEK_API_KEY:}
learning.ai.providers.gigachat.base-url=https://gigachat.devices.sberbank.ru/api/v1
learning.ai.providers.gigachat.auth-url=https://ngw.devices.sberbank.ru:9443/api/v2/oauth
learning.ai.providers.gigachat.auth-key=${MNEMA_AI_GIGACHAT_AUTH_KEY:}
learning.ai.providers.openrouter.base-url=https://openrouter.ai/api/v1
learning.ai.providers.openrouter.api-key=${MNEMA_AI_OPENROUTER_API_KEY:}
learning.ai.user-key.secret=${MNEMA_AI_USER_KEY_SECRET:}
# Egress proxy (docs/operations/ai-egress-proxy.md): providers unreachable from Russia are called through a stateless HTTP CONNECT proxy
# (http://host:port; TLS stays end to end). A provider opts in with learning.ai.providers.<id>.egress=proxy (default direct); without an
# active proxy it has no adapter (PROVIDER_NOT_CONFIGURED). enabled=false is the global kill switch of the proxied path. Local runs and CI
# need no proxy. The JVM needs -Djdk.http.auth.tunneling.disabledSchemes= for the Basic credentials (set in the runtime image).
learning.ai.egress.enabled=true
learning.ai.egress.proxy-url=${MNEMA_AI_EGRESS_PROXY_URL:}
learning.ai.egress.user=${MNEMA_AI_EGRESS_PROXY_USER:}
learning.ai.egress.password=${MNEMA_AI_EGRESS_PROXY_PASSWORD:}
# AI assessment of free explanations (ai-semantic, architecture section 11): an answer stays ASSESSING at most `deadline`, then the sweeper
# (every `sweep-interval`) makes it UNAVAILABLE and the learner rates themselves; `concurrency` answers are graded at once per instance.
learning.ai.assess.deadline=PT20S
learning.ai.assess.sweep-interval=PT2S
learning.ai.assess.concurrency=16
learning.ai.assess.feedback-language=ru
# Answers of one account graded at the same moment; beyond it an answer goes straight to self-check (reason BUSY).
learning.ai.assess.max-in-flight=3
# Price table in micro-US-dollars per 1M tokens. DeepSeek: peak-hour list prices (https://api-docs.deepseek.com/quick_start/pricing/),
# the conservative side of the off-peak discount. GigaChat 2 Lite: about 65 RUB per 1M tokens at 85 RUB/USD (approximate). OpenRouter
# reports the real cost of a call in usage.cost (used when present); its rows repeat the direct DeepSeek prices as the conservative fallback.
learning.ai.models[0].provider=deepseek
learning.ai.models[0].id=deepseek-flash
learning.ai.models[0].hit-micros-per-million=6000
learning.ai.models[0].miss-micros-per-million=300000
learning.ai.models[0].output-micros-per-million=1200000
learning.ai.models[1].provider=deepseek
learning.ai.models[1].id=deepseek-v4-pro
learning.ai.models[1].hit-micros-per-million=44000
learning.ai.models[1].miss-micros-per-million=1320000
learning.ai.models[1].output-micros-per-million=3960000
learning.ai.models[2].provider=gigachat
learning.ai.models[2].id=GigaChat-2
learning.ai.models[2].hit-micros-per-million=765000
learning.ai.models[2].miss-micros-per-million=765000
learning.ai.models[2].output-micros-per-million=765000
learning.ai.models[3].provider=openrouter
learning.ai.models[3].id=deepseek/deepseek-v4.1-flash
learning.ai.models[3].hit-micros-per-million=6000
learning.ai.models[3].miss-micros-per-million=300000
learning.ai.models[3].output-micros-per-million=1200000
learning.ai.models[4].provider=openrouter
learning.ai.models[4].id=deepseek/deepseek-v4-pro
learning.ai.models[4].hit-micros-per-million=44000
learning.ai.models[4].miss-micros-per-million=1320000
learning.ai.models[4].output-micros-per-million=3960000
# Gemini 3.8 Flash TTS (https://ai.google.dev/gemini-api/docs/pricing): input text $0.50, output audio $9.00 per million tokens until 2026-12-31;
# from 2027-01-01 it is $1.00 and $18.00: change the two values below then.
learning.ai.models[5].provider=google
learning.ai.models[5].id=gemini-3.8-flash-tts
learning.ai.models[5].hit-micros-per-million=500000
learning.ai.models[5].miss-micros-per-million=500000
learning.ai.models[5].output-micros-per-million=9000000
# Gemini 3.8 Flash-Lite TTS: input $0.50, output audio $6.00 per million tokens until 2026-12-31 ($1.00 / $12.00 from 2027-01-01). The default TTS model
# (owner hint 2026-10-05: higher rate limits, about 30 % cheaper, same latency in the spike); Flash TTS is its fallback.
learning.ai.models[6].provider=google
learning.ai.models[6].id=gemini-3.8-flash-lite-tts
learning.ai.models[6].hit-micros-per-million=500000
learning.ai.models[6].miss-micros-per-million=500000
learning.ai.models[6].output-micros-per-million=6000000
# Gemini speech-to-text models (https://ai.google.dev/gemini-api/docs/pricing, read 2026-10-05): 3.5 Flash-Lite $0.30 input (audio included) and $2.50 output
# per million tokens; 3.5 Transcribe, the dedicated model, $2.00 audio input and $12.00 output. Audio is 25 tokens a second in the live responses.
learning.ai.models[7].provider=google
learning.ai.models[7].id=gemini-3.5-flash-lite
learning.ai.models[7].hit-micros-per-million=300000
learning.ai.models[7].miss-micros-per-million=300000
learning.ai.models[7].output-micros-per-million=2500000
learning.ai.models[8].provider=google
learning.ai.models[8].id=gemini-3.5-transcribe
learning.ai.models[8].hit-micros-per-million=2000000
learning.ai.models[8].miss-micros-per-million=2000000
learning.ai.models[8].output-micros-per-million=12000000

# Which halves of the AI layer this process runs (architecture A1): api serves HTTP and creates work, worker executes steps
# and holds the provider keys, all (default, local and first release) does both. An unknown value stops the start.
learning.runtime.roles=${MNEMA_RUNTIME_ROLES:all}

# Generation sessions and steps (docs: backend/services/learning/guide.md, "Generation sessions"). Limits of a session
# (learning.generation.max-sources, max-artifacts-per-session, max-exercise-*) are in the usage module and default to the contract.
# Retention of a session: last activity plus this; it also bounds the media holds of its artifacts.
learning.generation.session-retention=P30D
# Admission: active sessions per account (PLANNING, PLAN_READY, RUNNING and REVIEW with something to review).
learning.generation.max-active-sessions=3
# The planner (AI-14, «Сначала показать план»): with it off, settings.planFirst is 422 SPEC_NOT_SUPPORTED. `deadline` is the budget of one
# PLAN step run (thinking is slower than a draft), `max-output-tokens` bounds the answer including the reasoning of a thinking model.
learning.generation.planner.enabled=true
learning.generation.planner.deadline=PT4M
learning.generation.planner.max-output-tokens=16000
# The ledger keeps cost in millionths of a rouble, the provider layer in micro-dollars: roubles per dollar (approximate).
learning.generation.usd-rub-rate=85
# A new title at least this similar (pg_trgm) to an existing material is reported to the Workshop as a warning.
learning.generation.similar-title=0.55
# Dispatcher: lease of a claim, heartbeat (renews the lease, observes a cancellation), sweeper, soft cap of running steps
# per account, how often the reservations of running sessions are renewed.
learning.generation.worker.lease=PT30S
learning.generation.worker.heartbeat=PT3S
learning.generation.worker.sweep-interval=PT2S
learning.generation.worker.account-cap=4
learning.generation.worker.renew-interval=PT10M
# Step retries: claims before a step fails, backoff with jitter, and the budget of one TEXT_DRAFT run (architecture section 4).
learning.generation.step.max-attempts=3
learning.generation.step.backoff-base=PT5S
learning.generation.step.backoff-cap=PT2M
learning.generation.step.text-draft-deadline=PT6M
# Lifetime of a whole step from its first claim, however often it is retried (architecture section 4); every requeue delay is
# also capped at backoff-cap, so a step never sits READY for long while the UI says "writing".
learning.generation.step.max-lifetime=PT1H
# Selection edits (guide.md, "Selection edits"): an EDIT step that no worker claimed within this time fails its turn (a person is waiting).
learning.generation.edit.queue-timeout=PT2M
# The intent call of «Попросить Мнему…» (#294): free of credits; calls per account and rolling hour (429 RATE_LIMITED above it) and the deadline of the call.
learning.generation.intent.per-hour=30
learning.generation.intent.deadline=PT20S
# BLOCKS_APPENDED checkpoints: at most one per interval, at most this many bytes of blocks per event (the log row holds
# 32 KiB of jsonb text, which is longer than the raw JSON).
learning.generation.stream.checkpoint-interval=PT0.75S
learning.generation.stream.max-event-bytes=24576
# Retention of sessions (guide.md, "Review commands"): how often the worker runs, how long an EXPIRED session stays readable before it is
# purged, how long before expiry the owner is warned (GENERATION_SESSION_EXPIRING), how long the events of an ended session are kept,
# and how many sessions one step of a run handles.
learning.generation.retention.interval=PT10M
learning.generation.retention.expired-readable=P1D
learning.generation.retention.warn-before=P3D
learning.generation.retention.events-after-end=P1D
learning.generation.retention.batch=50
# Context budgets of the text step, in estimated tokens (context-and-quality section 2.3).
learning.generation.context.outline-lines=200
learning.generation.context.latest-materials=40
learning.generation.context.top-k=40
learning.generation.context.exemplar-tokens=2500
learning.generation.context.exemplars-total-tokens=6000
learning.generation.context.notes-tokens=12000
learning.generation.context.outline-tokens=5000
# «Новое»: how long an exercise published by a generation approval counts as new for lists and Study when nobody opens or answers it
# (guide.md, "New mark"). The retention worker of Study purges expired marks.
learning.exercise.new-mark-ttl=P7D

learning.identity.issuer=${MNEMA_IDENTITY_ISSUER:}
learning.identity.timeout=2s
learning.identity.max-concurrency=32

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mnema}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/learning/migration
spring.flyway.default-schema=app_learning
spring.flyway.schemas=app_learning
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:dev}
info.release.id=${MNEMA_BUILD_ID:dev}
info.release.mode=maintenance
info.release.topology=identity-learning
info.release.runtime=learning-api
info.release.api-boundary=canonical

logging.pattern.console=ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p service=${spring.application.name} env=${APP_ENV:dev} trace_id=%X{traceId:-} span_id=%X{spanId:-} request_id=%X{requestId:-} logger=%c{1} msg=%m%n%wEx

# Licensed image search (#296). Sources in the order their results are interleaved; each source needs its own credentials (Pixabay a key, Openverse
# client credentials), except Wikimedia Commons (no key). All three answered directly from a Russian network on 2026-10-05 (Openverse with client
# credentials; an anonymous Openverse request once met a Cloudflare challenge): direct by default, egress=proxy is the fallback switch.
learning.ai.image-search.sources=pixabay,openverse,wikimedia
learning.ai.providers.pixabay.base-url=https://pixabay.com/api/
learning.ai.providers.pixabay.api-key=${MNEMA_AI_PIXABAY_API_KEY:}
learning.ai.providers.openverse.base-url=https://api.openverse.org/v1/
learning.ai.providers.openverse.client-id=${MNEMA_AI_OPENVERSE_CLIENT_ID:}
learning.ai.providers.openverse.client-secret=${MNEMA_AI_OPENVERSE_CLIENT_SECRET:}
learning.ai.providers.openverse.egress=direct
learning.ai.providers.wikimedia.base-url=https://commons.wikimedia.org/w/api.php

# Speech synthesis (#297). The route lists provider:model entries in fallback order; tts-ru, when not empty, serves Russian instead (SpeechKit is
# Russian only and is not in the default route: the live spike decides). Google is reached through the egress proxy (egress=proxy); without an active
# proxy it has no transport and the capability stays PROVIDER_NOT_CONFIGURED. learning.ai.providers.<id>.enabled=false is the per-provider kill switch.
learning.ai.routes.tts=google:gemini-3.8-flash-lite-tts,google:gemini-3.8-flash-tts
learning.ai.routes.tts-ru=
learning.ai.providers.google.base-url=https://generativelanguage.googleapis.com
learning.ai.providers.google.api-key=${MNEMA_AI_GOOGLE_API_KEY:}
learning.ai.providers.google.egress=proxy
learning.ai.providers.yandex.base-url=https://tts.api.cloud.yandex.net
learning.ai.providers.yandex.api-key=${MNEMA_AI_TTS_API_KEY:}
learning.ai.tts.yandex-folder-id=${MNEMA_AI_YANDEX_FOLDER_ID:}
learning.ai.tts.cache-ttl=P180D
learning.ai.tts.max-text=600
learning.ai.tts.version=v1

# Paywall (#301, AI-19): yearly discount per tier in percent off twelve months, the Max teaser («В работе») and the tier a learning goal
# points to. Prices come from contracts/usage/allowances-v1.json; there are no payments yet (#79).
learning.plans.year-discount-percent.plus=5
learning.plans.year-discount-percent.pro=10
learning.plans.year-discount-percent.max=10
learning.plans.max-teaser.enabled=false
learning.plans.recommendations.exams=PRO
learning.plans.recommendations.interview=PLUS
learning.plans.recommendations.language=PLUS
learning.plans.recommendations.work=PRO
learning.plans.recommendations.self=PLUS

# Speech to text (#298, AI-15). The route lists provider:model entries in fallback order; stt-ru, when not empty, serves Russian instead. The default is
# Gemini 3.5 Flash-Lite (about $0.0011 a minute, the same accuracy as the dedicated model on the 2026-10-05 spike) with the dedicated gemini-3.5-transcribe
# behind it (another quota); Google is reached through the egress proxy (egress=proxy), so without an active proxy the capability stays
# PROVIDER_NOT_CONFIGURED. The self-hosted plan (GigaAM-v3 for Russian, Qwen3-ASR for the rest) is an OpenAI-compatible container reached at
# MNEMA_AI_STT_BASE_URL (http allowed on a private host); none exists yet, so nothing routes to it: switch it on with
#   learning.ai.routes.stt-ru=selfhost:gigaam-v3
#   learning.ai.routes.stt=selfhost:qwen3-asr-0.6b,google:gemini-3.5-flash-lite
# Voice through Gemini needs the account's ABROAD consent (speech-consent); a self-hosted route is RU.
learning.ai.routes.stt=google:gemini-3.5-flash-lite,google:gemini-3.5-transcribe
learning.ai.routes.stt-ru=
learning.ai.providers.selfhost.base-url=${MNEMA_AI_STT_BASE_URL:}
learning.ai.providers.selfhost.api-key=${MNEMA_AI_STT_API_KEY:}
learning.ai.stt.call-timeout=PT25S
learning.ai.stt.min-avg-logprob=-1.0
learning.ai.stt.max-no-speech-prob=0.6
learning.ai.permits.stt=4
# Speech inputs: 20 per account in ten minutes, a row (text and metadata, never audio) lives 15 minutes, an input has 30 seconds from its creation.
learning.speech.rate-limit=20
learning.speech.rate-window=PT10M
learning.speech.ttl=PT15M
learning.speech.deadline=PT30S
learning.speech.sweep-interval=PT2S
learning.speech.consent-version=speech-2026-10
