# Spring TestContext cache: at most this many application contexts stay open in the test JVM (default 32). Every Learning context
# holds a Hikari pool and its beans; with 60+ property variants the default kept enough of them open to exhaust Gradle's 512 MiB
# test heap (OutOfMemoryError in CI on the community-decks epic 2 branches). Evicted contexts are closed and rebuilt on demand.
spring.test.context.cache.maxSize=12
