# Test defaults. A test context runs the API half only: the step dispatcher (learning.runtime.roles=worker|all) is a process
# that claims due steps of the whole shared test database, so contexts that do not test generation must not run it. The
# generation tests opt in with learning.runtime.roles=all.
learning.runtime.roles=api
# The storage GC schedule exists only for roles worker|all; a cached all-role context must not reclaim rows under other tests.
# The GC tests build StorageGc themselves and run passes explicitly.
learning.storage.gc.enabled=false
