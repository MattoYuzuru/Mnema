# Test defaults. A test context runs the API half only: the step dispatcher (learning.runtime.roles=worker|all) is a process
# that claims due steps of the whole shared test database, so contexts that do not test generation must not run it. The
# generation tests opt in with learning.runtime.roles=all.
learning.runtime.roles=api
# The storage GC schedule exists only for roles worker|all; a cached all-role context must not reclaim rows under other tests.
# The GC tests build StorageGc themselves and run passes explicitly.
learning.storage.gc.enabled=false

# The global cap of unfinished copies (default 200) counts the whole shared test database, where many fork tests leave copies preparing: lift it here;
# the cap itself is tested in an isolated database (ForkQueueCapHttpIntegrationTest).
learning.community.forks.max-unfinished-total=100000

# The Study retention schedule (roles worker|all) purges every old session of the shared test database; a cached all-role context must
# not do that under other tests. The retention tests build their passes themselves and run them explicitly.
learning.study.retention.enabled=false

# The catalogue schedule (roles worker|all) enqueues the hourly rank job and the daily anomaly job on the shared test database; a cached worker-role context must not
# do that under other tests. The Community/3 tests build their jobs and schedule themselves and run them explicitly.
learning.community.rank.enabled=false
learning.community.anomaly.enabled=false
