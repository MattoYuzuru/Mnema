# Release template: render with scripts/render-release-manifest.sh; do not apply directly.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnema-auth
  namespace: release-namespace-placeholder
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: { matchLabels: { app: mnema-auth } }
  template:
    metadata: { labels: { app: mnema-auth } }
    spec:
      automountServiceAccountToken: false

      initContainers:
        - name: wait-for-postgres
          image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
          command: ['sh','-c','until pg_isready -h postgres.release-namespace-placeholder.svc.cluster.local -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo waiting for postgres; sleep 2; done']
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_DB } }

      containers:
        - name: auth
          image: ghcr.io/mattoyuzuru/mnema/auth:release-placeholder
          ports: [ { containerPort: 8080 } ]
          env:
            - name: MNEMA_BUILD_ID
              value: "release-placeholder"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.release-namespace-placeholder.svc.cluster.local:5432/mnema
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_PASSWORD } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GOOGLE_CLIENT_ID } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GOOGLE_CLIENT_SECRET } }
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GITHUB_CLIENT_ID } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GITHUB_CLIENT_SECRET } }
            - name: YANDEX_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: YANDEX_CLIENT_ID } }
            - name: YANDEX_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: YANDEX_CLIENT_SECRET } }
            - name: AUTH_ISSUER
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AUTH_ISSUER } }
            - name: AUTH_JWT_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AUTH_JWT_PUBLIC_KEY } }
            - name: AUTH_JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AUTH_JWT_PRIVATE_KEY } }
            - name: USER_BASE_URL
              value: http://mnema-user/api/user
            - name: USER_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: USER_INTERNAL_TOKEN } }
            - name: AUTH_LOGOUT_DEFAULT_REDIRECT
              value: "https://release-public-host-placeholder/"
            - name: AUTH_LOGIN_PAGE_URL
              value: "https://release-public-host-placeholder/login"
            - name: AUTH_WEB_REDIRECT_URIS
              value: "https://release-public-host-placeholder/"
            - name: AUTH_SWAGGER_REDIRECT_URIS
              value: "https://release-public-host-placeholder/api/user/swagger-ui/oauth2-redirect.html"
            - name: APP_CORS_ORIGINS
              value: "https://release-public-host-placeholder"
            - name: TURNSTILE_SITE_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: TURNSTILE_SITE_KEY } }
            - name: TURNSTILE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: TURNSTILE_SECRET_KEY } }
            - name: SMOKE_LOGIN
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: SMOKE_LOGIN } }
            - name: SMOKE_TURNSTILE_BYPASS_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: SMOKE_TURNSTILE_BYPASS_KEY } }
            - name: APP_ENV
              value: "release-app-env-placeholder"
            - name: SPRING_PROFILES_ACTIVE
              value: "release-spring-profiles-placeholder"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mnema-auth
  namespace: release-namespace-placeholder
spec:
  selector: { app: mnema-auth }
  ports:
    - port: 80
      targetPort: 8080
