# Release template: render with scripts/render-release-manifest.sh; do not apply directly.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnema-media
  namespace: release-namespace-placeholder
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: { matchLabels: { app: mnema-media } }
  template:
    metadata: { labels: { app: mnema-media } }
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
          command: [ 'sh','-c','until pg_isready -h postgres.release-namespace-placeholder.svc.cluster.local -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo waiting for postgres; sleep 2; done' ]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_DB } }

      containers:
        - name: media
          image: ghcr.io/mattoyuzuru/mnema/media:release-placeholder
          ports: [ { containerPort: 8080 } ]
          env:
            - name: MNEMA_BUILD_ID
              value: "release-placeholder"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.release-namespace-placeholder.svc.cluster.local:5432/mnema
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_PASSWORD } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GOOGLE_CLIENT_ID } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GOOGLE_CLIENT_SECRET } }
            - name: AUTH_ISSUER_URI
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AUTH_ISSUER_URI } }
            - name: MEDIA_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: MEDIA_INTERNAL_TOKEN } }
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: AWS_REGION
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_REGION } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_SECRET_ACCESS_KEY } }
            - name: AWS_BUCKET_NAME
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_BUCKET_NAME } }
            - name: AWS_ENDPOINT
              value: "release-s3-endpoint-placeholder"
            - name: AWS_PUBLIC_ENDPOINT
              value: "release-s3-public-endpoint-placeholder"
            - name: AWS_PATH_STYLE_ACCESS
              value: "release-s3-path-style-placeholder"
            - name: APP_CORS_ORIGINS
              value: "https://release-public-host-placeholder"
            - name: APP_ENV
              value: "release-app-env-placeholder"
            - name: SPRING_PROFILES_ACTIVE
              value: "release-spring-profiles-placeholder"
          startupProbe:
            httpGet: { path: /api/media/actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /api/media/actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/media/actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mnema-media
  namespace: release-namespace-placeholder
spec:
  selector: { app: mnema-media }
  ports:
    - port: 80
      targetPort: 8080
