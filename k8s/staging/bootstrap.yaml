apiVersion: v1
kind: ResourceQuota
metadata:
  name: mnema-staging-quota
  namespace: mnema-staging
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 14Gi
    requests.storage: 20Gi
    requests.ephemeral-storage: 12Gi
    limits.ephemeral-storage: 40Gi
    persistentvolumeclaims: "5"
    pods: "30"
    services: "20"
    count/configmaps: "12"
    # mnema-secrets + three TLS Secrets + three cert-manager next-key Secrets,
    # with bounded headroom for renewal overlap and one recovery operation.
    count/secrets: "12"
    count/deployments.apps: "8"
    # Six current + twelve retained revisions, two concurrent template changes
    # per release, and one additional recovery revision per Deployment.
    count/replicasets.apps: "36"
    count/statefulsets.apps: "4"
    count/jobs.batch: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mnema-staging-limits
  namespace: mnema-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 256Mi
      default:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 2Gi
      max:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 4Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mnema-staging-default-deny
  namespace: mnema-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mnema-staging-allowed-traffic
  namespace: mnema-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: ::/0
            except:
              # Kubernetes canonicalizes IPv4-mapped CIDRs to the IPv4 family,
              # so ::ffff:0:0/96 is not a valid IPv6 ipBlock exception.
              - ::/128
              - ::1/128
              - 100::/64
              - 2001:db8::/32
              - fc00::/7
              - fe80::/10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mnema-deployer
  namespace: mnema-staging
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: mnema-secrets
  namespace: mnema-staging
  annotations:
    mnema.app/bootstrap-state: uninitialized
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mnema-deployer
  namespace: mnema-staging
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mnema-secrets"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events", "limitranges", "persistentvolumeclaims", "pods", "pods/log", "resourcequotas", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mnema-deployer
  namespace: mnema-staging
subjects:
  - kind: ServiceAccount
    name: mnema-deployer
    namespace: mnema-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mnema-deployer
