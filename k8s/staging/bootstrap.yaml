apiVersion: v1
kind: ResourceQuota
metadata:
  name: mnema-staging-quota
  namespace: mnema-staging
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 14Gi
    requests.storage: 20Gi
    persistentvolumeclaims: "5"
    pods: "30"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mnema-staging-limits
  namespace: mnema-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 1Gi
      max:
        cpu: "2"
        memory: 2Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mnema-deployer
  namespace: mnema-staging
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mnema-deployer
  namespace: mnema-staging
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events", "limitranges", "persistentvolumeclaims", "pods", "pods/log", "resourcequotas", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mnema-deployer
  namespace: mnema-staging
subjects:
  - kind: ServiceAccount
    name: mnema-deployer
    namespace: mnema-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mnema-deployer
