# Release template: render with scripts/render-release-manifest.sh; do not apply directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnema-identity-account
  namespace: release-namespace-placeholder
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: { matchLabels: { app: mnema-identity-account } }
  template:
    metadata: { labels: { app: mnema-identity-account } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: identity-account
          image: ghcr.io/mattoyuzuru/mnema/identity-account:release-placeholder
          ports: [ { containerPort: 8080 } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          env:
            - name: PORT
              value: "8080"
            - name: MNEMA_BUILD_ID
              value: "release-placeholder"
            - name: MNEMA_IDENTITY_ISSUER
              value: "https://release-auth-host-placeholder"
            - name: MNEMA_IDENTITY_FRONTEND_ORIGIN
              value: "https://release-public-host-placeholder"
            - name: MNEMA_IDENTITY_REDIRECT_URI
              value: "https://release-public-host-placeholder/auth/callback"
            - name: MNEMA_IDENTITY_TRUSTED_PROXY_CIDRS
              value: "10.42.0.0/16,fd42::/64"
            - name: MNEMA_IDENTITY_SIGNING_JWK_SET_FILE
              value: /var/run/secrets/mnema-identity/identity-signing-jwk-set.json
            - name: MNEMA_IDENTITY_SIGNING_ACTIVE_KID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: IDENTITY_SIGNING_ACTIVE_KID } }
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GOOGLE_CLIENT_ID } }
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GOOGLE_CLIENT_SECRET } }
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GITHUB_CLIENT_ID } }
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: GITHUB_CLIENT_SECRET } }
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_YANDEX_CLIENT_ID
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: YANDEX_CLIENT_ID } }
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_YANDEX_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: YANDEX_CLIENT_SECRET } }
            - name: MNEMA_POSTBOX_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTBOX_ACCESS_KEY, optional: true } }
            - name: MNEMA_POSTBOX_SECRET_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTBOX_SECRET_KEY, optional: true } }
            - name: MNEMA_AVATAR_ENDPOINT
              value: "release-s3-endpoint-placeholder"
            - name: MNEMA_AVATAR_ALLOW_STAGING_MINIO_HTTP
              value: "release-avatar-staging-minio-http-placeholder"
            - name: MNEMA_AVATAR_REGION
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_REGION } }
            - name: MNEMA_AVATAR_BUCKET
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_BUCKET_NAME } }
            - name: MNEMA_AVATAR_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: MNEMA_AVATAR_SECRET_KEY
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: AWS_SECRET_ACCESS_KEY } }
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.release-namespace-placeholder.svc.cluster.local:5432/mnema
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: mnema-secrets, key: POSTGRES_PASSWORD } }
            - name: APP_ENV
              value: "release-app-env-placeholder"
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: identity-signing, mountPath: /var/run/secrets/mnema-identity, readOnly: true }
          startupProbe:
            httpGet: { path: /api/actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        - name: identity-signing
          secret:
            secretName: mnema-secrets
            defaultMode: 0440
            items:
              - { key: IDENTITY_SIGNING_JWK_SET, path: identity-signing-jwk-set.json }
---
apiVersion: v1
kind: Service
metadata:
  name: mnema-identity-account
  namespace: release-namespace-placeholder
spec:
  selector: { app: mnema-identity-account }
  ports:
    - port: 80
      targetPort: 8080
