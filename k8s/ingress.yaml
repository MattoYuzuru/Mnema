# ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mnema
  namespace: release-namespace-placeholder
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - release-public-host-placeholder
      secretName: mnema-app-tls
  rules:
    - host: release-public-host-placeholder
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mnema-frontend
                port:
                  number: 80
          - path: /api/user
            pathType: Prefix
            backend:
              service:
                name: mnema-user
                port:
                  number: 80
          - path: /api/core
            pathType: Prefix
            backend:
              service:
                name: mnema-core
                port:
                  number: 80
          - path: /api/media
            pathType: Prefix
            backend:
              service:
                name: mnema-media
                port:
                  number: 80
          - path: /api/import
            pathType: Prefix
            backend:
              service:
                name: mnema-import
                port:
                  number: 80
