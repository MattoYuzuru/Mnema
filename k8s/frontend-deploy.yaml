# Release template: render with scripts/render-release-manifest.sh; do not apply directly.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnema-frontend
  namespace: release-namespace-placeholder
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: mnema-frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: mnema-frontend }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/mattoyuzuru/mnema/frontend:release-placeholder
          env:
            - name: MNEMA_BUILD_ID
              value: "release-placeholder"
            - name: MNEMA_AUTH_SERVER_URL
              value: "https://release-auth-host-placeholder"
            - name: MNEMA_FEATURE_AI_ENABLED
              value: "false"
          ports: [ { containerPort: 80 } ]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mnema-frontend
  namespace: release-namespace-placeholder
spec:
  selector: { app: mnema-frontend }
  ports:
    - port: 80
      targetPort: 80
