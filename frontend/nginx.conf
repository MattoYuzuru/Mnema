# Link previews without SSR (#436, docs/operations/link-previews.md). HTML navigations to /d/{code}[/{slug}] are answered from index.html with
# the head fragment of Learning's /api/public/meta/decks/{code}/head put in by SSI (ngx_http_ssi_module). The maps read the ORIGINAL request URI (also
# inside the subrequests): a code of the 10-character base58 alphabet, otherwise empty, and an empty code means "not a deck address": nothing is asked
# of Learning.
map $request_uri $mnema_og_code {
  default "";
  "~^/d/(?<code>[1-9A-HJ-NP-Za-km-z]{10})(?:/[A-Za-z0-9._~%-]{1,200})?/?(?:\?.*)?$" $code;
}
# The address that was asked for, without a trailing slash and the query: /d/{code} or /d/{code}/{slug}.
map $request_uri $mnema_og_path {
  default "";
  "~^(?<path>/d/[1-9A-HJ-NP-Za-km-z]{10}(?:/[A-Za-z0-9._~%-]{1,200})?)/?(?:\?.*)?$" $path;
}
# Learning names the canonical path of a PUBLIC deck (X-Mnema-Canonical); the redirect target is that path, when it has the exact shape and differs from
# the path asked for. Anything else (no canonical path, the same path) is empty.
map "$mnema_og_canonical|$mnema_og_path" $mnema_og_redirect {
  default "";
  "~^(?<canonical>/d/[1-9A-HJ-NP-Za-km-z]{10}/[a-z0-9-]{1,80})\|(?!\k<canonical>$)" $canonical;
}
# X-Mnema-Preview of the page: redirect | card | generic (Learning's X-Mnema-Preview, whitelisted) | fallback (the unchanged shell).
map "$mnema_og_redirect|$mnema_og_kind" $mnema_og_label {
  default fallback;
  "~^/d/[^|]+\|" redirect;
  "~^\|card$" card;
  "~^\|generic$" generic;
}
# One cached answer per deck code serves the gate and the include: 60 s for a card, 10 s for "disabled" and for Learning's own failures. A refusal for
# one visitor's rate limit (429) is deliberately not cached: it would become every visitor's.
proxy_cache_path /var/cache/nginx/mnema-og levels=1:2 keys_zone=mnema_og:1m max_size=4m inactive=2m use_temp_path=off;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Link previews: host:port of Learning, set by the generated conf.d/mnema-og-meta.inc (MNEMA_OG_META_UPSTREAM, frontend/docker/40-gen-app-config.sh).
  # Empty (the default) switches the feature off: Learning is never called and /d/... is the shell (processed by SSI with the stub).
  set $mnema_meta_upstream "";
  include /etc/nginx/conf.d/mnema-og-meta*.inc;
  absolute_redirect off;

  # Preserve the generated response-security headers inside locations that add
  # their own cache headers. Supported by the pinned nginx 1.31 image.
  add_header_inherit merge;
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/html
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # In the standalone image, API requests must never fall through to SPA HTML.
  location ^~ /api/ {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  location = /assets/og-image.png {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location = /app-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /favicon.ico {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # --- Link previews (OG) without SSR (#436, docs/operations/link-previews.md) -------------------------------------------------------------------
  # Any failure (Learning down, slow, disabled, limited, an unexpected answer) serves the plain index.html, never an error page: error_page below for
  # the gate, `stub` for the include. Placed after the asset location so that /d/... file extensions keep their 404.
  location ~ ^/d/ {
    # 1. gate: Learning's answer for the code (cached, see the include below); its headers decide the redirect, the page headers and the fallback.
    auth_request /__mnema_og_gate;
    auth_request_set $mnema_og_canonical $upstream_http_x_mnema_canonical;
    auth_request_set $mnema_og_kind $upstream_http_x_mnema_preview;
    auth_request_set $mnema_og_robots $upstream_http_x_robots_tag;
    error_page 401 403 500 =200 @mnema_og_fallback;
    # The redirect is decided in rewrite-phase directives, which run before the access phase: hand over to a named location after the gate.
    try_files /__mnema_og_never__ @mnema_og_page;
  }

  location @mnema_og_page {
    if ($mnema_og_redirect != "") {
      return 301 $mnema_og_redirect$is_args$args;
    }
    # 2. index.html with the head fragment included by SSI (the block and the include are in frontend/src/index.html; without a usable answer the
    # block is the stub, i.e. the unchanged defaults). SSI drops Last-Modified; the validators of the static file would describe the wrong bytes.
    ssi on;
    ssi_silent_errors on;
    etag off;
    if_modified_since off;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    # `X-Robots-Tag: noindex` for the generic card, besides its robots meta tag (empty value: no header).
    add_header X-Robots-Tag $mnema_og_robots always;
    add_header X-Mnema-Preview $mnema_og_label always;
    rewrite ^ /index.html break;
  }

  # The unchanged index.html (its validators and cache policy as on any route) when the gate did not give a usable answer.
  location @mnema_og_fallback {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Mnema-Preview fallback always;
    rewrite ^ /index.html break;
  }

  location = /__mnema_og_gate {
    internal;
    if ($mnema_og_code = "") { return 204; }
    if ($mnema_meta_upstream = "") { return 204; }
    proxy_pass http://$mnema_meta_upstream/api/public/meta/decks/$mnema_og_code/head;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream off;
    proxy_connect_timeout 100ms;
    proxy_send_timeout 300ms;
    proxy_read_timeout 300ms;
    proxy_cache mnema_og;
    proxy_cache_key $mnema_og_code;
    proxy_cache_valid 200 60s;
    proxy_cache_valid 404 10s;
    proxy_cache_valid 500 502 503 504 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 300ms;
    proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
    # auth_request copies the subrequest's WWW-Authenticate onto a 401 it passes on, and a 401 is also the one status that is not turned into a 500:
    # make it a plain failure, so the page falls back without a challenge header.
    proxy_intercept_errors on;
    error_page 401 = @mnema_og_gate_failed;
  }

  location @mnema_og_gate_failed {
    return 500;
  }

  location = /__mnema_og_head {
    internal;
    if ($mnema_og_code = "") { return 204; }
    if ($mnema_meta_upstream = "") { return 204; }
    proxy_pass http://$mnema_meta_upstream/api/public/meta/decks/$mnema_og_code/head;
    proxy_pass_request_headers off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream off;
    proxy_connect_timeout 100ms;
    proxy_send_timeout 300ms;
    proxy_read_timeout 300ms;
    proxy_cache mnema_og;
    proxy_cache_key $mnema_og_code;
    proxy_cache_valid 200 60s;
    proxy_cache_valid 404 10s;
    proxy_cache_valid 500 502 503 504 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 300ms;
    proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
    # SSI prints the body of whatever the subrequest answers, error pages included; an error body in <head> would be worse than the defaults. Every
    # status of 300 and above, whether Learning's (intercepted) or nginx's own (timeout, refused), becomes an empty answer, which selects `stub`.
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 = @mnema_og_empty;
  }

  location @mnema_og_empty {
    return 204;
  }
}
