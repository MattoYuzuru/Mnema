<button type="button" class="select-trigger" role="combobox" [id]="controlId()" [disabled]="disabled()"
        [attr.aria-label]="label() + ': ' + selectedLabel()" [attr.aria-expanded]="open()"
        [attr.aria-controls]="open() ? controlId() + '-listbox' : null"
        [attr.aria-activedescendant]="activeOptionId()" [attr.aria-invalid]="invalid() ? 'true' : null"
        [attr.data-answer-control]="answerControl() ? '' : null"
        (click)="toggle()" (keydown)="onKeydown($event)">
  <span class="selected-text">{{ selectedLabel() }}</span><span class="chevron" aria-hidden="true"></span>
</button>
@if (open()) {
  <div class="options" role="listbox" [id]="controlId() + '-listbox'" [attr.aria-label]="label()">
    @for (option of options(); track option.value; let index = $index) {
      <div role="option" class="option" [id]="controlId() + '-option-' + index"
           [class.is-active]="activeIndex() === index" [attr.aria-selected]="option.value === value()"
           [attr.aria-disabled]="option.disabled ? 'true' : null"
           (mousedown)="$event.preventDefault()" (click)="choose(index)">{{ option.label }}</div>
    }
  </div>
}
