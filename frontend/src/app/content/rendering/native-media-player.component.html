<div class="mnema-player" [class.is-video]="kind() === 'video'">
  @if (kind() === 'video') {
    <video #video class="mnema-player-screen" [src]="source()" [attr.poster]="poster()" preload="metadata" playsinline
      [attr.aria-label]="title()" (loadedmetadata)="sync()" (durationchange)="sync()"
      (timeupdate)="sync()" (play)="sync()" (pause)="sync()" (ended)="sync()"
      (waiting)="sync()" (playing)="sync()" (error)="sync()"></video>
  } @else {
    <audio #audio [src]="source()" preload="metadata" [attr.aria-label]="title()"
      (loadedmetadata)="sync()" (durationchange)="sync()" (timeupdate)="sync()"
      (play)="sync()" (pause)="sync()" (ended)="sync()" (waiting)="sync()"
      (playing)="sync()" (error)="sync()"></audio>
  }
  <div class="mnema-player-controls" role="group" [attr.aria-label]="'Управление: ' + title()">
    <button type="button" class="mnema-player-action" [attr.aria-label]="playing() ? 'Пауза' : 'Воспроизвести'"
      (click)="toggle()">{{ playing() ? 'Ⅱ' : '▶' }}</button>
    <span class="mnema-player-time" aria-hidden="true">{{ elapsedText() }}</span>
    <input type="range" min="0" [max]="seekMax()" step="any" [value]="position()"
      [disabled]="seekMax() === 0" [attr.aria-label]="'Позиция: ' + title()"
      [attr.aria-valuetext]="elapsedText() + ' из ' + durationText()" (input)="seek($any($event.target).value)" />
    <span class="mnema-player-time" aria-hidden="true">{{ durationText() }}</span>
    <button type="button" class="mnema-player-action" [attr.aria-label]="muted() ? 'Включить звук' : 'Выключить звук'"
      (click)="toggleMute()"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V4l10 3v4L9 8"/><ellipse cx="6" cy="18" rx="3" ry="2" fill="currentColor"/>@if (muted()) { <path d="M3 3l18 18"/> }</svg></button>
    <div class="mnema-player-speed"><label [for]="speedControlId">Скорость</label>
      <app-mnema-select [controlId]="speedControlId" label="Скорость" [compact]="true"
        [options]="speedOptions" [value]="speed().toString()" (valueChange)="changeSpeed($event)" />
    </div>
    @if (kind() === 'video') { <button type="button" class="mnema-player-action" aria-label="На весь экран" (click)="fullscreen()">⛶</button> }
  </div>
  @if (waiting()) { <p class="mnema-player-note" role="status">Загружаем продолжение…</p> }
  @if (error()) { <p class="mnema-player-note error" role="alert">Файл пока не воспроизводится. Обновляем доступ…</p> }
</div>
