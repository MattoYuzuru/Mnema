server {
  listen 8443 ssl;
  server_name localhost;
  server_tokens off;

  ssl_certificate /run/secrets/mnema_local_tls_cert;
  ssl_certificate_key /run/secrets/mnema_local_tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $learning_upstream learning:8080;

  # Keep redirects relative behind Caddy/TLS and local mapped ports.
  absolute_redirect off;
  root /usr/share/nginx/html;
  add_header_inherit merge;
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  location ^~ /api/ {
    # Preserve Learning's strong ETags for If-Match writes. Gzip changes the
    # representation and turns the origin validator into a weak ETag.
    gzip off;
    # Speech inputs (#298) are raw audio up to 2 MiB; nginx refuses bodies over 1 MiB by default. Learning enforces every API limit itself.
    client_max_body_size 2100k;
    proxy_pass http://$learning_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
  }

  location = / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files /index.html =404;
  }

  # Generated filenames are delivery artifacts, not additional Angular routes.
  location ~ ^/(ai|events|privacy|terms)/index\.html$ {
    return 308 /$1$is_args$args;
  }

  # Public documents are generated by Angular; no crawler/user-agent special cases.
  location ~ ^/(ai|events|privacy|terms)/?$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files /$1/index.html =404;
  }

  # Auth and private routes keep CSR and lazy feature imports. /styleguide is dev-only in Angular.
  location ~ ^/(?:login|register|auth/callback|profile|plans|manage/events|styleguide|decks(?:/.*)?)/?$ {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, follow" always;
    try_files /index.csr.html /index.html =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ =404;
  }

  # Preserve a real 404 while Angular renders the navigation and recovery link.
  error_page 404 /index.csr.html;
  location = /index.csr.html {
    internal;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, follow" always;
  }



  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    return 308 /$is_args$args;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  location = /assets/og-image.png {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  # Brand URLs are stable across releases, so immutable year-long caching is inappropriate.
  location ~ ^/assets/brand/.*\.(?:svg|png|webp)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location = /app-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /favicon.ico {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

server {
  listen 8444 ssl;
  server_name localhost frontend;
  server_tokens off;

  ssl_certificate /run/secrets/mnema_local_tls_cert;
  ssl_certificate_key /run/secrets/mnema_local_tls_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $identity_upstream identity-account:8081;

  location / {
    proxy_pass http://$identity_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
  }
}
