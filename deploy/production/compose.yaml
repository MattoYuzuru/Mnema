# Linux VPS only. Every listener binds loopback; no Docker-published ports/NAT.
x-service: &service
  network_mode: host
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}

x-backend: &backend
  <<: *service
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  mem_limit: 2g
  cpus: 2
  pids_limit: 256
  stop_grace_period: 30s

services:
  postgres:
    <<: *service
    image: ${MNEMA_POSTGRES_IMAGE:?verified-candidate-required}
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, port=15432, -c, log_statement=none, -c, log_min_error_statement=panic]
    environment:
      POSTGRES_DB: mnema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MNEMA_POSTGRES_PASSWORD:?private bootstrap required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      MNEMA_IDENTITY_DB_PASSWORD: ${MNEMA_IDENTITY_DB_PASSWORD:?private bootstrap required}
      MNEMA_LEARNING_DB_PASSWORD: ${MNEMA_LEARNING_DB_PASSWORD:?private bootstrap required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${MNEMA_PRODUCTION_ROOT:-/etc/mnema/production}/init-database.sh:/docker-entrypoint-initdb.d/10-mnema.sh:ro
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, "15432", -U, postgres, -d, mnema]
      interval: 10s
      timeout: 5s
      retries: 12

  identity-account:
    <<: *backend
    image: ${MNEMA_IDENTITY_ACCOUNT_IMAGE:?verified-candidate-required}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      APP_ENV: prod
      SERVER_ADDRESS: 127.0.0.1
      PORT: "18081"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      MNEMA_BUILD_ID: ${MNEMA_BUILD_ID:?verified-candidate-required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:15432/mnema
      SPRING_DATASOURCE_USERNAME: app_identity
      SPRING_DATASOURCE_PASSWORD: ${MNEMA_IDENTITY_DB_PASSWORD:?private bootstrap required}
      MNEMA_IDENTITY_ISSUER: https://auth.mnema.app
      MNEMA_IDENTITY_FRONTEND_ORIGIN: https://mnema.app
      MNEMA_IDENTITY_REDIRECT_URI: https://mnema.app/auth/callback
      MNEMA_IDENTITY_TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128
      MNEMA_IDENTITY_SIGNING_JWK_SET_FILE: /run/secrets/identity-signing.json
      MNEMA_IDENTITY_SIGNING_ACTIVE_KID: production-20261004
      # required (default) verifies Cloudflare Turnstile before password login/registration; blocked is the operational kill switch.
      MNEMA_IDENTITY_TURNSTILE_MODE: ${MNEMA_IDENTITY_TURNSTILE_MODE:-required}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: ${GH_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${GH_CLIENT_SECRET:-}
      MNEMA_IDENTITY_DELETION_ENABLED: "false"
      # Optional capabilities, activated only by the deployed application configuration (app.env). Empty equals the application default: password-recovery and
      # verification mail are not sent without the Yandex Postbox key pair, and avatar upload stays unavailable without the key pair.
      MNEMA_POSTBOX_ACCESS_KEY: ${MNEMA_POSTBOX_ACCESS_KEY:-}
      MNEMA_POSTBOX_SECRET_KEY: ${MNEMA_POSTBOX_SECRET_KEY:-}
      # Set-but-empty is "" to Spring, so the non-empty application defaults are repeated here.
      MNEMA_AVATAR_ENDPOINT: ${MNEMA_AVATAR_ENDPOINT:-https://storage.yandexcloud.net}
      MNEMA_AVATAR_REGION: ${MNEMA_AVATAR_REGION:-ru-central1}
      MNEMA_AVATAR_BUCKET: ${MNEMA_AVATAR_BUCKET:-mnema-prod-avatars-b1g0dnrijqn8}
      MNEMA_AVATAR_ACCESS_KEY: ${MNEMA_AVATAR_ACCESS_KEY:-}
      MNEMA_AVATAR_SECRET_KEY: ${MNEMA_AVATAR_SECRET_KEY:-}
    volumes:
      - ${MNEMA_PRODUCTION_ROOT:-/etc/mnema/production}/identity-signing.json:/run/secrets/identity-signing.json:ro
    healthcheck:
      test: [CMD, java, -cp, /app/readiness, MnemaReadiness, "18081"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  learning:
    <<: *backend
    image: ${MNEMA_LEARNING_IMAGE:?verified-candidate-required}
    depends_on:
      postgres: {condition: service_healthy}
      identity-account: {condition: service_healthy}
    environment:
      APP_ENV: prod
      SERVER_ADDRESS: 127.0.0.1
      PORT: "18082"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      MNEMA_BUILD_ID: ${MNEMA_BUILD_ID:?verified-candidate-required}
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:15432/mnema
      SPRING_DATASOURCE_USERNAME: app_learning
      SPRING_DATASOURCE_PASSWORD: ${MNEMA_LEARNING_DB_PASSWORD:?private bootstrap required}
      MNEMA_IDENTITY_ISSUER: https://auth.mnema.app
      MNEMA_RUNTIME_ROLES: all
      MNEMA_EVENTS_OWNER_ACCOUNT_ID: ${MNEMA_EVENTS_OWNER_ACCOUNT_ID:-}
      LEARNING_AI_EGRESS_ENABLED: "false"
      LEARNING_FEATURES_AI_ASSESSMENT_ENABLED: "false"
      LEARNING_FEATURES_AI_GENERATION_ENABLED: "false"
      LEARNING_FEATURES_TEXT_TO_SPEECH_ENABLED: "false"
      LEARNING_FEATURES_IMAGE_GENERATION_ENABLED: "false"
      # Media object storage (Yandex Object Storage). Without the key pair (app.env) upload stays unconfigured. Set-but-empty is "" to
      # Spring, so the non-empty defaults are repeated here.
      LEARNING_MEDIA_UPLOAD_ENDPOINT: ${LEARNING_MEDIA_UPLOAD_ENDPOINT:-https://storage.yandexcloud.net}
      LEARNING_MEDIA_UPLOAD_REGION: ${LEARNING_MEDIA_UPLOAD_REGION:-ru-central1}
      LEARNING_MEDIA_UPLOAD_BUCKET: ${LEARNING_MEDIA_UPLOAD_BUCKET:-mnema-prod-media-b1g0dnrijqn8}
      LEARNING_MEDIA_UPLOAD_ACCESS_KEY: ${LEARNING_MEDIA_UPLOAD_ACCESS_KEY:-}
      LEARNING_MEDIA_UPLOAD_SECRET_KEY: ${LEARNING_MEDIA_UPLOAD_SECRET_KEY:-}
      LEARNING_MEDIA_UPLOAD_MAX_IMAGE_BYTES: "33554432"
      LEARNING_MEDIA_UPLOAD_MAX_AUDIO_BYTES: "134217728"
      LEARNING_MEDIA_UPLOAD_MAX_VIDEO_BYTES: "1073741824"
      LEARNING_MEDIA_UPLOAD_MAX_RESERVED_BYTES: "2147483648"
      # Every media kind reaches READY only through the root media runner (a host service, not a Compose service) and its throw-away containers.
      LEARNING_MEDIA_PROCESSING_ENABLED: "true"
      LEARNING_MEDIA_PROCESSING_WORK_ROOT: /var/lib/mnema-media
      LEARNING_MEDIA_PROCESSING_MAX_PARALLEL: "1"
      LEARNING_MEDIA_GC_ENABLED: "true"
      LEARNING_MEDIA_GC_GRACE: P7D
      # Promo codes and A/B (#302). Without a nonblank hash secret (>= 32 characters), promo creation/redemption are disabled; Learning keeps running.
      # Without the experiment secret every account stays on control. The popup is off unless enabled with its copy.
      MNEMA_PROMO_HASH_SECRET: ${MNEMA_PROMO_HASH_SECRET:-}
      # Abuse limits: attempts per address hash per hour (default 20) and the accounts one address may serve for the same code in 24 hours (default 10, the next one is refused).
      MNEMA_PROMO_IP_ATTEMPTS_PER_HOUR: ${MNEMA_PROMO_IP_ATTEMPTS_PER_HOUR:-20}
      MNEMA_PROMO_VELOCITY_ACCOUNTS: ${MNEMA_PROMO_VELOCITY_ACCOUNTS:-10}
      MNEMA_EXPERIMENT_SECRET: ${MNEMA_EXPERIMENT_SECRET:-}
      MNEMA_PROMO_POPUP_ENABLED: ${MNEMA_PROMO_POPUP_ENABLED:-false}
      MNEMA_PROMO_POPUP_ID: ${MNEMA_PROMO_POPUP_ID:-}
      MNEMA_PROMO_POPUP_TITLE: ${MNEMA_PROMO_POPUP_TITLE:-}
      MNEMA_PROMO_POPUP_BODY: ${MNEMA_PROMO_POPUP_BODY:-}
      MNEMA_PROMO_POPUP_CTA: ${MNEMA_PROMO_POPUP_CTA:-}
      MNEMA_PROMO_POPUP_CODE: ${MNEMA_PROMO_POPUP_CODE:-}
      MNEMA_PROMO_POPUP_COOLDOWN: ${MNEMA_PROMO_POPUP_COOLDOWN:-P14D}
      # Billing (#389): T-Bank hosted checkout. OFF unless app.env says TESTERS (only the listed account ids) or ON; real money stays OFF until the
      # launch checklist's bank, legal and receipt gates pass. The terminal password arrives base64-encoded (a bank password may contain '$').
      MNEMA_BILLING_CHECKOUT: ${MNEMA_BILLING_CHECKOUT:-OFF}
      MNEMA_BILLING_TESTER_ACCOUNT_IDS: ${MNEMA_BILLING_TESTER_ACCOUNT_IDS:-}
      MNEMA_TBANK_TERMINAL_KEY: ${MNEMA_TBANK_TERMINAL_KEY:-}
      MNEMA_TBANK_PASSWORD_BASE64: ${MNEMA_TBANK_PASSWORD_BASE64:-}
      # «Мой налог» (НПД) receipts of paid orders (#392): OFF queues a receipt per paid order and sends nothing; ON sends (needs the taxpayer's INN and the
      # base64 of the personal-account password, or Learning refuses to start). The host lknpd.nalog.ru is reachable from this server only.
      MNEMA_NPD_RECEIPTS: ${MNEMA_NPD_RECEIPTS:-OFF}
      MNEMA_NPD_INN: ${MNEMA_NPD_INN:-}
      MNEMA_NPD_PASSWORD_BASE64: ${MNEMA_NPD_PASSWORD_BASE64:-}
      MNEMA_PUBLIC_BASE_URL: https://mnema.app
    volumes:
      # Learning's job spool: a subdirectory (owner 10001, mode 0700) of the root-owned, bounded media-work filesystem (loopback ext4 behind
      # a systemd mount unit). Media jobs run in per-job containers started by the root service mnema-media-runner, which reads these
      # directories and writes the verdicts; no container of Compose touches the work filesystem except this one mount. See README.md.
      - type: bind
        source: /var/lib/mnema/media-work/spool
        target: /var/lib/mnema-media
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, java, -cp, /app/readiness, MnemaReadiness, "18082"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  frontend:
    <<: *service
    image: ${MNEMA_FRONTEND_IMAGE:?verified-candidate-required}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      MNEMA_APP_ENV: prod
      MNEMA_PUBLIC_ORIGIN: https://mnema.app
      MNEMA_AUTH_SERVER_URL: https://auth.mnema.app
      MNEMA_STORAGE_ORIGIN: https://storage.yandexcloud.net
      MNEMA_IDENTITY_REDIRECT_URI: https://mnema.app/auth/callback
      MNEMA_LEARNING_API_BASE_URL: /api
      MNEMA_SUPPORT_TELEGRAM_USERNAME: ${MNEMA_SUPPORT_TELEGRAM_USERNAME:-Mnema_Support_Bot}
      MNEMA_CLIENT_ID: mnema-web
      MNEMA_BUILD_ID: ${MNEMA_BUILD_ID:?verified-candidate-required}
      MNEMA_FEATURE_SHOW_EMAIL_VERIFICATION_WARNING: "false"
    volumes:
      - ${MNEMA_PRODUCTION_ROOT:-/etc/mnema/production}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:18080/index.html]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
