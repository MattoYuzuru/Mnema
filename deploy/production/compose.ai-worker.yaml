# Reviewed opt-in overlay, NOT part of the protected default rollout. All production AI gates remain disabled.
# Configure only admitted flows and the same routes/flags/budgets on both roles before opting in.
services:
  learning:
    environment:
      MNEMA_RUNTIME_ROLES: api
      MNEMA_PROVIDER_CREDENTIALS: worker
  learning-ai-worker:
    extends:
      file: compose.yaml
      service: learning
    environment:
      MNEMA_RUNTIME_ROLES: worker
      MNEMA_PROVIDER_CREDENTIALS: local
      PORT: "18084"
      MANAGEMENT_SERVER_PORT: "18085"
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      MNEMA_MANAGEMENT_EXPOSURE: health,info,metrics
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      MNEMA_AI_DEEPSEEK_API_KEY: ${MNEMA_AI_DEEPSEEK_API_KEY:-}
      MNEMA_AI_GIGACHAT_AUTH_KEY: ${MNEMA_AI_GIGACHAT_AUTH_KEY:-}
      MNEMA_AI_OPENROUTER_API_KEY: ${MNEMA_AI_OPENROUTER_API_KEY:-}
      MNEMA_AI_PIXABAY_API_KEY: ${MNEMA_AI_PIXABAY_API_KEY:-}
      MNEMA_AI_OPENVERSE_CLIENT_ID: ${MNEMA_AI_OPENVERSE_CLIENT_ID:-}
      MNEMA_AI_OPENVERSE_CLIENT_SECRET: ${MNEMA_AI_OPENVERSE_CLIENT_SECRET:-}
      MNEMA_AI_GOOGLE_API_KEY: ${MNEMA_AI_GOOGLE_API_KEY:-}
      MNEMA_AI_TTS_API_KEY: ${MNEMA_AI_TTS_API_KEY:-}
      MNEMA_AI_YANDEX_FOLDER_ID: ${MNEMA_AI_YANDEX_FOLDER_ID:-}
      MNEMA_AI_STT_BASE_URL: ${MNEMA_AI_STT_BASE_URL:-}
      MNEMA_AI_STT_API_KEY: ${MNEMA_AI_STT_API_KEY:-}
      MNEMA_AI_YANDEX_SEARCH_API_KEY: ${MNEMA_AI_YANDEX_SEARCH_API_KEY:-}
      MNEMA_AI_PERPLEXITY_API_KEY: ${MNEMA_AI_PERPLEXITY_API_KEY:-}
      MNEMA_AI_USER_KEY_SECRET: ${MNEMA_AI_USER_KEY_SECRET:-}
      MNEMA_AI_EGRESS_PROXY_URL: ${MNEMA_AI_EGRESS_PROXY_URL:-}
      MNEMA_AI_EGRESS_PROXY_USER: ${MNEMA_AI_EGRESS_PROXY_USER:-}
      MNEMA_AI_EGRESS_PROXY_PASSWORD: ${MNEMA_AI_EGRESS_PROXY_PASSWORD:-}
    healthcheck:
      test: [CMD, java, -cp, /app/readiness, MnemaReadiness, "18085", /actuator/health/readiness]
