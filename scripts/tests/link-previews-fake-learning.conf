# A stand-in for Learning's /api/public/meta/decks/{code}/head, only for scripts/test-link-previews.sh. The codes are scenarios; every answer is what the
# real endpoint produces for that case (its escaping is proven by the backend tests), so this file proves what the WEB SERVER does with the answers.
# Every request that reaches the stand-in is logged, so the test can count the calls of a page view (scripts/test-link-previews.sh).
log_format fake '$request_method $uri xff=[$http_x_forwarded_for] status=$status';
# One answer per code per minute: the second request for the same code is refused with 500, whatever its kind.
limit_req_zone $uri zone=fake_once:1m rate=1r/m;

server {
  listen 127.0.0.1:18082;
  access_log /var/log/nginx/fake-learning.log fake;
  default_type text/plain;
  charset utf-8;

  # PUBLIC deck: a card and its canonical path, which the web server compares with the path it was asked for.
  location = /api/public/meta/decks/Kq7xT3mNpR/head {
    add_header X-Mnema-Preview "card";
    add_header X-Mnema-Canonical "/d/Kq7xT3mNpR/ispanskie-glagoly";
    add_header Content-Security-Policy "default-src 'none'; sandbox";
    add_header Cache-Control "public, max-age=300";
    return 200 '<title>Испанские глаголы — Mnema</title>
<meta name="description" content="Автор: Анна (@anna.k). Двести самых частых глаголов.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://mnema.app/d/Kq7xT3mNpR/ispanskie-glagoly">
<meta property="og:title" content="Испанские глаголы">
<meta property="og:url" content="https://mnema.app/d/Kq7xT3mNpR/ispanskie-glagoly">
';
  }

  # LINK / INVITE / PRIVATE / unknown: the generic noindex card, no canonical, no redirect.
  location = /api/public/meta/decks/Lk7xT3mNpR/head {
    add_header X-Mnema-Preview "generic";
    add_header X-Robots-Tag "noindex";
    add_header Content-Security-Policy "default-src 'none'; sandbox";
    return 200 '<title>Mnema</title>
<meta name="description" content="Ваши материалы и упражнения — в одном месте.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Mnema — учиться, понимать, помнить">
';
  }

  # The first request for the code is a card, the next one fails with an error page (the include must not print it). The first answer carries a
  # Set-Cookie, which keeps nginx from caching it, so the include really asks again.
  location = /api/public/meta/decks/Hd5xT3mNpR/head {
    limit_req zone=fake_once;
    limit_req_status 500;
    proxy_pass http://$server_addr:$server_port/__first_answer;
  }
  location = /__first_answer {
    add_header X-Mnema-Preview "card";
    add_header Set-Cookie "uncacheable=1";
    return 200 '<title>Первый ответ</title>
';
  }

  # The card reflects what the web server sent upstream: no cookie, no credential, the visitor's address last.
  location = /api/public/meta/decks/Ec7xT3mNpR/head {
    return 200 '<title>Mnema</title>
<meta name="seen" content="cookie=[$http_cookie] authorization=[$http_authorization] xff=[$http_x_forwarded_for] method=$request_method accept-encoding=[$http_accept_encoding]">
<meta name="robots" content="noindex">
';
  }

  # Failures of the gate: unavailable, limited, disabled (404), forbidden, and a host that never answers.
  location = /api/public/meta/decks/Gt5xT3mNpR/head { return 503; }
  location = /api/public/meta/decks/Rk7xT3mNpR/head { return 429; }
  location = /api/public/meta/decks/Nf7xT3mNpR/head { return 404; }
  location = /api/public/meta/decks/Fb7xT3mNpR/head { return 403; }
  location = /api/public/meta/decks/Bh7xT3mNpR/head {
    proxy_connect_timeout 3s;
    proxy_pass http://10.255.255.1:81;
  }

  # A 401 carries a challenge: it must not reach the page. (The real Learning does not send one for these routes; the web server must not depend on that.)
  location = /api/public/meta/decks/Au7xT3mNpR/head {
    add_header WWW-Authenticate 'Bearer realm="stand-in"' always;
    return 401 'unauthorized body';
  }

  # Calls are counted by the test: a card (cached 60 s), "disabled" (cached 10 s) and a refusal for one visitor's limit (429, never cached).
  location = /api/public/meta/decks/Ca7xT3mNpR/head {
    add_header X-Mnema-Preview "card";
    add_header X-Mnema-Canonical "/d/Ca7xT3mNpR/counted-card";
    return 200 '<title>Счётная колода — Mnema</title>
';
  }
  location = /api/public/meta/decks/Cp7xT3mNpR/head {
    add_header X-Mnema-Preview "card";
    add_header X-Mnema-Canonical "/d/Cp7xT3mNpR/parallel";
    return 200 '<title>Параллельная колода — Mnema</title>
';
  }
  location = /api/public/meta/decks/Cn7xT3mNpR/head { return 404; }
  location = /api/public/meta/decks/Cr7xT3mNpR/head { return 429; }

  # An empty card: the stub (the defaults) must be used.
  location = /api/public/meta/decks/Em7xT3mNpR/head { return 204; }
}
