schema_version: 2
updated_at: "2026-10-07"
scope: repository
status: current

capabilities:
  - id: backend-quality
    kind: command
    location: backend/build.gradle.kts
    invoke: "cd backend && ./gradlew clean quality"
    effects: [compile, test, coverage-report, coverage-baseline-check]
    status: configured
    requirements: [jdk25, docker-for-postgresql-tests]

  - id: frontend-quality
    kind: command-set
    location: frontend/package.json
    invoke: "cd frontend && npm ci && npm run lint && npm run test && npm run build"
    effects: [dependency-install, lint, jsdom-unit-test, production-build]
    status: configured
    requirements: [node-24.21.0]

  - id: docs-validation
    kind: deterministic-check
    location: scripts/verify_docs.py
    invoke: "python3 scripts/verify_docs.py"
    effects: [validate-local-markdown-links, validate-canonical-doc-status]
    status: configured
    tests: "python3 -m unittest scripts.tests.test_verify_docs -v"

  - id: identity-learning-security
    kind: local-blackbox-harness
    location: scripts/learning-security
    invoke: "python3 scripts/learning-security/run.py"
    effects: [disposable-postgresql, start-packaged-services, protocol-security-checks]
    status: configured

  - id: browser-identity-authoring
    kind: local-browser-e2e-harness
    location: scripts/browser-identity
    invoke: "python3 scripts/browser-identity/run.py --dist frontend/dist/mnema-frontend --node /opt/homebrew/opt/node@24/bin/node --authoring --media --mechanics"
    effects: [disposable-services, local-https, real-chrome, evidence-output]
    status: configured

  - id: repository-policy-and-operations-contracts
    kind: command-set
    location: .github/workflows/pull-request.yaml
    effects: [policy-tests, security-contracts, smoke-tests]
    status: configured

  - id: pull-request-quality
    kind: github-actions-workflow
    location: .github/workflows/pull-request.yaml
    trigger: pull_request_to_main
    effects: [backend-quality, frontend-quality]
    status: configured

  - id: dependency-review
    kind: github-actions-workflow
    location: .github/workflows/dependency-review.yaml
    trigger: dependency_changing_pull_request_to_main
    effects: [dependency-diff-policy]
    status: configured

  - id: codeql
    kind: github-hosted-workflow
    location: dynamic/github-code-scanning/codeql
    effects: [code-scanning]
    status: configured-default-setup
    notes: [managed-in-github-settings, no-checked-in-workflow]

  - id: main-quality
    kind: github-actions-workflow
    location: .github/workflows/deploy.yaml
    trigger: push_to_main_or_workflow_dispatch
    effects: [backend-quality, frontend-quality, release-scope, four-image-publication, prod-approved-deployment, public-smoke]
    status: configured
    notes: [docs-only-pushes-skip-release, publication-security-gates-required, one-prod-environment-approval]

  - id: local-replacement-runtime
    kind: compose
    location: docker-compose.yml
    effects: [local-postgresql, identity-account, learning]
    status: configured
    notes: [frontend-not-in-compose, fresh-data-only, loopback-ports]

  - id: persistent-local-product-runtime
    kind: compose-launcher
    location: scripts/mnema-local-full-stack.sh
    invoke: "scripts/mnema-local-full-stack.sh start"
    effects: [local-image-build, retained-local-data, loopback-https-product-runtime]
    status: configured
    notes: [production-frontend-by-default, development-frontend-opt-in-for-styleguide]
    canonical_policy: docs/deploy/selfhost-local.md

  - id: vps-production
    kind: github-actions-workflow
    location: .github/workflows/vps-deploy.yaml
    trigger: workflow_dispatch_on_main
    effects: [status, verify, rollback-to-recorded-compatible-previous-release]
    status: configured
    requirements: [prod-environment-approval]
    notes: [deployments-run-only-in-main-ci, host-config-installed-by-administrator-with-drift-check]
    canonical_policy: docs/operations/production-delivery.md

repository_agent_assets:
  normative_instructions: AGENTS.md
  host_adapters: [CLAUDE.md, .github/copilot-instructions.md]
  scoped_instructions: [backend/AGENTS.md, frontend/AGENTS.md]
  navigator: docs/README.md
  repository_guide: docs/engineering/repository-guide.md
  skills: []
  plugins: []
  hooks: []
  mcp_servers: []

credential_notes:
  - "Credential values are never inventoried or printed."
  - "Repository access does not imply environment access."
  - "Production administrator SSH is mnema; CI has a separate fixed-command identity, no configuration upload."
