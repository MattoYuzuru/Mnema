# Local maintenance shells. Keep the replacement project/data separate from v1.
name: mnema-replacement

services:
  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: ${MNEMA_LOCAL_POSTGRES_DB:-mnema}
      POSTGRES_USER: ${MNEMA_LOCAL_POSTGRES_USER:-mnema}
      POSTGRES_PASSWORD: ${MNEMA_LOCAL_POSTGRES_PASSWORD:?Set a fresh MNEMA_LOCAL_POSTGRES_PASSWORD for the replacement database}
    ports:
      - "127.0.0.1:${MNEMA_LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - replacement_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-account:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: identity-account-runtime
    environment:
      PORT: "8080"
      APP_ENV: local
      MNEMA_BUILD_ID: ${MNEMA_LOCAL_BUILD_ID:-dev}
      # Issuer identity requires HTTPS; local actuator transport remains HTTP.
      MNEMA_IDENTITY_ISSUER: ${MNEMA_LOCAL_IDENTITY_ISSUER:-https://localhost:18081}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MNEMA_LOCAL_POSTGRES_DB:-mnema}
      SPRING_DATASOURCE_USERNAME: ${MNEMA_LOCAL_POSTGRES_USER:-mnema}
      SPRING_DATASOURCE_PASSWORD: ${MNEMA_LOCAL_POSTGRES_PASSWORD:?Set a fresh MNEMA_LOCAL_POSTGRES_PASSWORD for the replacement database}
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:${MNEMA_LOCAL_IDENTITY_PORT:-18081}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  learning:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: learning-runtime
    environment:
      APP_ENV: local
      MNEMA_BUILD_ID: ${MNEMA_LOCAL_BUILD_ID:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MNEMA_LOCAL_POSTGRES_DB:-mnema}
      SPRING_DATASOURCE_USERNAME: ${MNEMA_LOCAL_POSTGRES_USER:-mnema}
      SPRING_DATASOURCE_PASSWORD: ${MNEMA_LOCAL_POSTGRES_PASSWORD:?Set a fresh MNEMA_LOCAL_POSTGRES_PASSWORD for the replacement database}
    depends_on:
      postgres: {condition: service_healthy}
    ports:
      - "127.0.0.1:${MNEMA_LOCAL_LEARNING_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  replacement_postgres_data:
