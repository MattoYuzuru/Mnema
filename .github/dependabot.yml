version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    groups:
      gradle-compatible:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      gradle-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/k8s"
      - "/k8s/ai"
      - "/k8s/backup"
      - "/k8s/observability"
      - "/k8s/staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    groups:
      docker-compatible:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        group-by: "dependency-name"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Keep the Angular 18 dependency graph visible without routine npm update PRs.
  # Security updates stay enabled and are grouped separately from version updates.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: "security-updates"
        patterns:
          - "*"
