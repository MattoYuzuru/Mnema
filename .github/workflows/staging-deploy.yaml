name: Staging Deploy

on:
  workflow_run:
    workflows: [Main CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate-main-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Validate Main CI predecessor
        run: |
          if [ "$UPSTREAM_CONCLUSION" != success ]; then
            echo "::error::Main CI did not succeed"
            exit 1
          fi
          if [ "$UPSTREAM_BRANCH" != main ]; then
            echo "::error::Main CI did not run for main"
            exit 1
          fi
          case "$UPSTREAM_EVENT" in
            push | workflow_dispatch) ;;
            *) echo "::error::Unsupported Main CI event: ${UPSTREAM_EVENT}"; exit 1 ;;
          esac
          if ! printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Main CI did not provide an exact release SHA"
            exit 1
          fi

      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download staging release manifest for preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-release-manifest
          path: ${{ runner.temp }}/staging-preflight
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download production promotion manifest for preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-release-manifest
          path: ${{ runner.temp }}/production-preflight
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify exact release artifacts before staging access
        env:
          STAGING_DIR: ${{ runner.temp }}/staging-preflight
          PRODUCTION_DIR: ${{ runner.temp }}/production-preflight
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          (cd "$STAGING_DIR" && sha256sum --check staging-release.yaml.sha256)
          (cd "$STAGING_DIR" && sha256sum --check release-security-evidence.json.sha256)
          (cd "$PRODUCTION_DIR" && sha256sum --check production-release.yaml.sha256)
          (cd "$PRODUCTION_DIR" && sha256sum --check release-security-evidence.json.sha256)
          for entry in \
            "staging-preflight|$STAGING_DIR/staging-release.yaml|$RUNNER_TEMP/staging-preflight-record.json" \
            "production-preflight|$PRODUCTION_DIR/production-release.yaml|$RUNNER_TEMP/production-preflight-record.json"
          do
            environment=${entry%%|*}
            remainder=${entry#*|}
            manifest=${remainder%%|*}
            record=${remainder#*|}
            python3 scripts/smoke/release_state.py build-record \
              --environment "$environment" \
              --manifest "$manifest" \
              --record "$record" >/dev/null
            artifact_sha=$(python3 -c \
              'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseId"])' \
              "$record")
            if [ "$artifact_sha" != "$RELEASE_SHA" ]; then
              echo "::error::${environment} artifact does not match the tested revision"
              exit 1
            fi
          done
          python3 scripts/verify_release_security_evidence.py verify-release \
            --evidence "$STAGING_DIR/release-security-evidence.json" \
            --manifest "$STAGING_DIR/staging-release.yaml" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-commit "$RELEASE_SHA" \
            --trivy-ignore security/trivy-release-ignore \
            --expected-run-id "$UPSTREAM_RUN_ID"
          python3 scripts/verify_release_security_evidence.py verify-release \
            --evidence "$PRODUCTION_DIR/release-security-evidence.json" \
            --manifest "$PRODUCTION_DIR/production-release.yaml" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-commit "$RELEASE_SHA" \
            --trivy-ignore security/trivy-release-ignore \
            --expected-run-id "$UPSTREAM_RUN_ID"
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale staging release ${RELEASE_SHA}; current main is ${current_main}"
            exit 1
          fi

  deploy-staging:
    needs: validate-main-ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    environment:
      name: staging
      url: https://staging.mnema.app
    env:
      KUBECONFIG: ${{ github.workspace }}/kubeconfig-staging
      NS: mnema-staging
      RELEASE_MANIFEST: ${{ github.workspace }}/staging-release.yaml
      RELEASE_RECORD: ${{ github.workspace }}/.release-state/staging-release-record.json
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      ROLLBACK_MANIFEST: ${{ github.workspace }}/.release-state/staging-rollback-release.yaml
      ROLLBACK_RECORD: ${{ github.workspace }}/.release-state/staging-rollback-record.json
      TRANSITION_PLAN: ${{ github.workspace }}/.release-state/staging-transition-plan.json
      ROLLBACK_SMOKE_REPORT: ${{ github.workspace }}/.release-state/staging-rollback-smoke-report.json
      SMOKE_REPORT: ${{ github.workspace }}/.release-state/staging-smoke-report.json
      DIAGNOSTICS_DIR: ${{ github.workspace }}/.release-state/staging-release-diagnostics
      AUTO_ROLLBACK_ENABLED: ${{ vars.AUTO_ROLLBACK_ENABLED || 'true' }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.8

      - name: Download staging release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-release-manifest
          path: ${{ github.workspace }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download production promotion manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-release-manifest
          path: ${{ runner.temp }}/production-promotion
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify release artifact integrity
        env:
          STAGING_IDENTITY_RECORD: ${{ runner.temp }}/staging-release-identity.json
        run: |
          sha256sum --check staging-release.yaml.sha256
          sha256sum --check release-security-evidence.json.sha256
          python3 scripts/smoke/release_state.py build-record \
            --environment staging-artifact \
            --manifest "$RELEASE_MANIFEST" \
            --record "$STAGING_IDENTITY_RECORD" >/dev/null
          artifact_sha=$(python3 -c \
            'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseId"])' \
            "$STAGING_IDENTITY_RECORD")
          if [ "$artifact_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Staging release artifact does not match the tested revision"
            exit 1
          fi
          python3 scripts/verify_release_security_evidence.py verify-release \
            --evidence release-security-evidence.json \
            --manifest "$RELEASE_MANIFEST" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-commit "$RELEASE_SHA" \
            --trivy-ignore security/trivy-release-ignore \
            --expected-run-id "${{ github.event.workflow_run.id }}"

      - name: Verify production promotion artifact integrity
        env:
          PRODUCTION_MANIFEST: ${{ runner.temp }}/production-promotion/production-release.yaml
          PRODUCTION_RECORD: ${{ runner.temp }}/production-promotion-record.json
        run: |
          (cd "$(dirname "$PRODUCTION_MANIFEST")" && sha256sum --check production-release.yaml.sha256)
          (cd "$(dirname "$PRODUCTION_MANIFEST")" && sha256sum --check release-security-evidence.json.sha256)
          python3 scripts/smoke/release_state.py build-record \
            --environment production-promotion \
            --manifest "$PRODUCTION_MANIFEST" \
            --record "$PRODUCTION_RECORD" >/dev/null
          promotion_sha=$(python3 -c \
            'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseId"])' \
            "$PRODUCTION_RECORD")
          if [ "$promotion_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Production promotion manifest does not match the tested revision"
            exit 1
          fi
          python3 scripts/verify_release_security_evidence.py verify-release \
            --evidence "$(dirname "$PRODUCTION_MANIFEST")/release-security-evidence.json" \
            --manifest "$PRODUCTION_MANIFEST" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-commit "$RELEASE_SHA" \
            --trivy-ignore security/trivy-release-ignore \
            --expected-run-id "${{ github.event.workflow_run.id }}"

      - name: Reject a stale release
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale staging release ${RELEASE_SHA}; current main is ${current_main}"
            exit 1
          fi

      - name: Write namespace-scoped kubeconfig
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          if [ -z "$STAGING_KUBECONFIG_B64" ]; then
            echo "::error::STAGING_KUBECONFIG_B64 is required"
            exit 1
          fi
          printf '%s' "$STAGING_KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Verify namespace-scoped deployment identity
        run: |
          test "$(kubectl auth can-i create deployments.apps -n "$NS")" = yes
          test "$(kubectl auth can-i create services -n "$NS")" = yes
          test "$(kubectl auth can-i update secret/mnema-secrets -n "$NS")" = yes
          test "$(kubectl auth can-i create secrets -n "$NS")" = no
          test "$(kubectl auth can-i list secrets -n "$NS")" = no
          test "$(kubectl auth can-i create ingresses.networking.k8s.io -n "$NS")" = no
          test "$(kubectl auth can-i patch ingress/mnema -n "$NS")" = yes
          test "$(kubectl auth can-i patch ingress/mnema-auth -n "$NS")" = yes
          test "$(kubectl auth can-i patch ingress/minio -n "$NS")" = no
          test "$(kubectl auth can-i get secrets -n prod)" = no
          test "$(kubectl auth can-i create namespaces)" = no
          kubectl -n "$NS" get resourcequota mnema-staging-quota >/dev/null
          kubectl -n "$NS" get limitrange mnema-staging-limits >/dev/null

      # The replacement runtime consumes the existing staging PostgreSQL data and
      # an add-only fresh signing set. Existing or different signing state is never rotated here.
      - name: Verify existing staging bootstrap and rollback policy
        run: |
          case "$AUTO_ROLLBACK_ENABLED" in
            true | false) ;;
            *) echo '::error::AUTO_ROLLBACK_ENABLED must be true or false'; exit 1 ;;
          esac
          kubectl -n "$NS" get secret mnema-secrets -o json |
            python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["metadata"]["annotations"]["mnema.app/bootstrap-state"] == "initialized"; assert all(s.get("data", {}).get(k) for k in ("POSTGRES_DB", "POSTGRES_USER", "POSTGRES_PASSWORD"))'
          kubectl -n "$NS" rollout status statefulset/postgres --timeout=1200s

      - name: Build candidate staging release record
        run: |
          python3 scripts/smoke/release_state.py build-record \
            --environment staging \
            --manifest "$RELEASE_MANIFEST" \
            --record "$RELEASE_RECORD"

      - name: Snapshot the current complete staging release
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/smoke/release_state.py snapshot \
            --namespace "$NS" \
            --environment staging \
            --artifact-name staging-release-manifest \
            --artifact-filename staging-release.yaml \
            --rollback-manifest "$ROLLBACK_MANIFEST" \
            --rollback-record "$ROLLBACK_RECORD"

      - name: Preview complete staging plan before mutation
        run: |
          python3 scripts/smoke/release_state.py plan-transition \
            --source-manifest "$ROLLBACK_MANIFEST" \
            --target-manifest "$RELEASE_MANIFEST" \
            --plan "$TRANSITION_PLAN"
          ./scripts/preview-staging-plan.sh --replacement \
            "$RELEASE_MANIFEST" "$ROLLBACK_MANIFEST" "$TRANSITION_PLAN"

      - name: Preview immutable staging Identity signing bootstrap
        env:
          IDENTITY_SIGNING_JWK_SET: ${{ secrets.STAGING_IDENTITY_SIGNING_JWK_SET }}
          IDENTITY_SIGNING_ACTIVE_KID: ${{ secrets.STAGING_IDENTITY_SIGNING_ACTIVE_KID }}
        run: python3 scripts/bootstrap-staging-identity-signing.py --dry-run

      - name: Reject a stale release immediately before staging mutation
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale staging release ${RELEASE_SHA}; current main is ${current_main}"
            exit 1
          fi

      - name: Bootstrap immutable staging Identity signing secret
        env:
          IDENTITY_SIGNING_JWK_SET: ${{ secrets.STAGING_IDENTITY_SIGNING_JWK_SET }}
          IDENTITY_SIGNING_ACTIVE_KID: ${{ secrets.STAGING_IDENTITY_SIGNING_ACTIVE_KID }}
        run: python3 scripts/bootstrap-staging-identity-signing.py

      - name: Mark the candidate mutation boundary
        id: mutation-start
        run: echo 'attempted=true' >> "$GITHUB_OUTPUT"

      - name: Apply complete staging application release once
        id: apply
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          kubectl apply -f "$RELEASE_MANIFEST"
          python3 scripts/smoke/release_state.py apply-removals \
            --plan "$TRANSITION_PLAN" \
            --source-manifest "$ROLLBACK_MANIFEST" \
            --target-manifest "$RELEASE_MANIFEST"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Verify staging service rollouts
        id: rollout
        continue-on-error: true
        run: |
          python3 scripts/smoke/release_state.py rollout \
            --namespace "$NS" --record "$RELEASE_RECORD"

      - name: Run staging black-box release smoke
        id: smoke
        if: ${{ steps.rollout.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment staging \
            --mode maintenance \
            --identity-url https://auth.staging.mnema.app \
            --learning-url https://staging.mnema.app \
            --expected-release-sha "$RELEASE_SHA" \
            --timeout-seconds 300 \
            --report "$SMOKE_REPORT"

      - name: Record successful complete staging release
        id: record
        if: ${{ steps.rollout.outcome == 'success' && steps.smoke.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/smoke/release_state.py record \
            --namespace "$NS" \
            --manifest "$RELEASE_MANIFEST" \
            --record "$RELEASE_RECORD"

      - name: Upload verified staging release record
        if: ${{ steps.record.outcome == 'success' }}
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: staging-release-record
          name: staging-release-record-${{ github.run_id }}
          path: ${{ env.RELEASE_RECORD }}
          if-no-files-found: error
          retention-days: 90
          classification: release-state

      - name: Report the production promotion boundary
        if: ${{ steps.record.outcome == 'success' }}
        run: echo 'release_mode=maintenance production_eligible=false production_cutover_issue=147'

      - name: Collect sanitized staging diagnostics
        if: ${{ always() && (failure() || steps.rollout.outcome != 'success' || steps.smoke.outcome != 'success' || steps.record.outcome != 'success') }}
        continue-on-error: true
        run: |
          python3 scripts/smoke/collect_diagnostics.py \
            --namespace "$NS" \
            --output "$DIAGNOSTICS_DIR" \
            --smoke-report "$SMOKE_REPORT"

      - name: Roll back failed staging candidate
        id: rollback
        if: ${{ always() && steps.mutation-start.outputs.attempted == 'true' && steps.snapshot.outputs.previous_available == 'true' && (steps.rollout.outcome != 'success' || steps.smoke.outcome != 'success' || steps.record.outcome != 'success') && env.AUTO_ROLLBACK_ENABLED == 'true' }}
        run: |
          python3 scripts/smoke/release_state.py rollback \
            --namespace "$NS" \
            --rollback-manifest "$ROLLBACK_MANIFEST" \
            --rollback-record "$ROLLBACK_RECORD" \
            --candidate-manifest "$RELEASE_MANIFEST"

      - name: Verify staging rollback rollouts
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        run: |
          python3 scripts/smoke/release_state.py rollout \
            --namespace "$NS" --record "$ROLLBACK_RECORD"

      - name: Verify maintenance staging rollback
        if: ${{ always() && steps.rollback.outcome == 'success' && steps.rollback.outputs.release_mode == 'maintenance' && steps.rollback.outputs.maintenance_smoke_supported == 'true' }}
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment staging-rollback \
            --mode maintenance \
            --identity-url https://auth.staging.mnema.app \
            --learning-url https://staging.mnema.app \
            --expected-release-sha "${{ steps.rollback.outputs.release_id }}" \
            --timeout-seconds 300 \
            --report "$ROLLBACK_SMOKE_REPORT"

      - name: Verify previous maintenance staging rollback
        if: ${{ always() && steps.rollback.outcome == 'success' && steps.rollback.outputs.release_mode == 'maintenance' && steps.rollback.outputs.maintenance_smoke_supported != 'true' }}
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment staging-rollback-previous-maintenance \
            --mode maintenance \
            --identity-url https://auth.staging.mnema.app \
            --learning-url https://staging.mnema.app \
            --expected-release-sha "${{ steps.rollback.outputs.release_id }}" \
            --timeout-seconds 300 \
            --skip-identity-protocol \
            --report "$ROLLBACK_SMOKE_REPORT"

      - name: Verify adopted legacy staging rollback identity
        if: ${{ always() && steps.rollback.outcome == 'success' && steps.rollback.outputs.release_mode != 'maintenance' && steps.rollback.outputs.authenticated_smoke_supported != 'true' }}
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment staging-rollback-legacy \
            --public-url https://staging.mnema.app \
            --auth-url https://auth.staging.mnema.app \
            --expected-release-sha "${{ steps.rollback.outputs.release_id }}" \
            --timeout-seconds 300 \
            --identity-only \
            --report "$ROLLBACK_SMOKE_REPORT"

      - name: Verify complete staging rollback
        if: ${{ always() && steps.rollback.outcome == 'success' && steps.rollback.outputs.release_mode != 'maintenance' && steps.rollback.outputs.authenticated_smoke_supported == 'true' }}
        env:
          SMOKE_LOGIN: ${{ secrets.STAGING_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.STAGING_SMOKE_TURNSTILE_BYPASS_KEY }}
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment staging-rollback \
            --public-url https://staging.mnema.app \
            --auth-url https://auth.staging.mnema.app \
            --expected-release-sha "${{ steps.rollback.outputs.release_id }}" \
            --timeout-seconds 300 \
            --report "$ROLLBACK_SMOKE_REPORT"

      - name: Upload staging failure evidence
        if: ${{ always() && (failure() || steps.rollout.outcome != 'success' || steps.smoke.outcome != 'success' || steps.record.outcome != 'success') }}
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: staging-failure-diagnostics
          name: staging-release-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.DIAGNOSTICS_DIR }}
            ${{ env.SMOKE_REPORT }}
            ${{ env.ROLLBACK_SMOKE_REPORT }}
            ${{ env.ROLLBACK_RECORD }}
          if-no-files-found: warn
          retention-days: 30
          classification: sanitized-diagnostics

      - name: Fail rejected staging candidate
        if: ${{ always() && (steps.rollout.outcome != 'success' || steps.smoke.outcome != 'success' || steps.record.outcome != 'success') }}
        run: |
          echo '::error::Staging candidate failed release verification; rollback evidence is attached when enabled.'
          exit 1
