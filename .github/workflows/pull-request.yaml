name: PR Quality

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run isolated backend shard
        working-directory: backend
        run: ./gradlew test --parallel --max-workers=2 -PtestShard=${{ matrix.shard }}/8 -PtestForks=2

      - name: Collect bounded backend evidence
        run: python3 scripts/backend_test_evidence.py pack --index ${{ matrix.shard }}

      - name: Upload backend shard evidence
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: pr-backend-shard
          name: backend-tests-${{ matrix.shard }}
          path: backend/build/ci-shard/
          retention-days: 7
          if-no-files-found: error
          classification: internal-test-report

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Prepare cached PostgreSQL security fixture
        run: docker pull postgres:18

      - name: Verify Identity to Learning black-box security
        timeout-minutes: 15
        run: |
          ./backend/gradlew -p backend :services:identity-account:bootJar :services:learning:bootJar
          MNEMA_RUN_CANCELLATION_INTEGRATION=1 python3 -m unittest discover -s scripts/learning-security/tests -v
          python3 scripts/learning-security/run.py
          python3 scripts/learning-security/verify_cancellation.py

  backend-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up JDK 25 for the runtime readiness contract
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify VPS runtime and isolated local restore
        timeout-minutes: 5
        run: |
          docker build --tag mnema-vps-postgres-fixture:verified deploy/production
          python3 -m unittest discover -s scripts/tests -p 'test_vps_*.py' -v

      - name: Verify the media runner, the worker image and its codec matrix
        timeout-minutes: 15
        run: |
          # No skip is allowed in these suites: a missing tool must break the build, not turn the check into a no-op.
          python3 scripts/require_no_skips.py --path scripts/tests test_media_runner test_verify_production_dispatcher
          docker build --tag mnema-media-worker:verified backend/media-worker
          # The image carries no tests; they and the guard are mounted read-only. The codec matrix runs in the hardened
          # configuration the runner uses (no network, read-only root, no capability, tmpfs /tmp).
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 3g --cpus 2 --tmpfs /tmp:rw,size=512m,mode=1777 \
            --volume "$PWD/backend/media-worker/tests:/opt/mnema-media-worker/tests:ro" \
            --volume "$PWD/scripts/require_no_skips.py:/opt/require_no_skips.py:ro" --entrypoint python3 \
            mnema-media-worker:verified /opt/require_no_skips.py tests.test_worker

  release-images:
    # The release Dockerfiles from their real contexts, scanned with the release blocking rule, before merge.
    # Nothing is pushed or attested here; Main CI build-and-push repeats the scan on the exact release digests.
    # A pull request that changes no release-image input (the release-scope rule) skips the build with a summary.
    # Only frontend-quality waits for it, so the backend coverage merge is not delayed by image builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-account
            context: ./backend
            target: identity-account-runtime
          - name: learning
            context: ./backend
            target: learning-runtime
          - name: postgres
            context: ./deploy/production
            target: ""
          - name: media-worker
            context: ./backend/media-worker
            target: ""
          - name: frontend
            context: ./frontend
            target: ""
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether a release-image input changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -I scripts/release_scope.py --changed "$BASE_SHA" HEAD

      - name: Route Docker Hub pulls through mirror.gcr.io
        if: ${{ steps.scope.outputs.runtime == 'true' }}
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up Docker Buildx
        if: ${{ steps.scope.outputs.runtime == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build ${{ matrix.name }} without publishing
        if: ${{ steps.scope.outputs.runtime == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: mnema-preflight/${{ matrix.name }}:pr
          # Read-only reuse of the trusted main release cache; a pull request never writes a release scope.
          cache-from: type=gha,scope=release-${{ matrix.name }}

      - name: Scan the unpublished image with Trivy
        if: ${{ steps.scope.outputs.runtime == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mnema-preflight/${{ matrix.name }}:pr
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/preflight-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          timeout: 10m
          version: v0.70.0
          cache: true
          trivyignores: security/trivy-release-ignore

      - name: Apply the release vulnerability policy
        if: ${{ steps.scope.outputs.runtime == 'true' }}
        env:
          SERVICE: ${{ matrix.name }}
          IMAGE: mnema-preflight/${{ matrix.name }}:pr
        run: python3 scripts/verify_release_security_evidence.py preflight --image "$IMAGE" --service "$SERVICE" --report "$RUNNER_TEMP/preflight-trivy.json" --exceptions security/release-image-exceptions.json --trivy-ignore security/trivy-release-ignore

  backend-quality:
    if: ${{ always() }}
    needs: [backend-tests, backend-security, backend-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require every quality block
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['QUALITY_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Quality blocks did not all succeed: {failed}')
          PYCODE

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Discover the complete backend test inventory
        working-directory: backend
        run: ./gradlew testInventory --parallel --max-workers=2

      - name: Download backend shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-tests-*
          path: backend/build/ci-inputs

      - name: Verify shard completeness and combine execution data
        run: python3 scripts/backend_test_evidence.py merge

      - name: Enforce combined backend coverage
        working-directory: backend
        run: ./gradlew --parallel --max-workers=2 compileJava jacocoTestReport jacocoRootReport coverageBaselineCheck -PcoverageShards=8 -x test

      - name: Upload backend coverage report
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: pr-backend-jacoco
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/jacocoRootReport/
          retention-days: 30
          if-no-files-found: warn
          classification: internal-test-report

  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Verify GitHub automation policies
        run: |
          python3 scripts/verify_docs.py
          python3 scripts/verify_github_actions_pins.py
          python3 scripts/verify_security_automation_policy.py
          python3 scripts/verify_artifact_security_policy.py
          python3 scripts/verify_production_image_pins.py
          python3 -m unittest discover -s scripts/tests -p 'test_verify_*.py' -v
          # The remaining script suites; tests/test_verify_checks.py fails when a new suite is owned by no job.
          python3 -m unittest scripts.tests.test_ai_ops_metrics_snapshot scripts.tests.test_ai_worker_topology scripts.tests.test_local_full_stack_media scripts.tests.test_ranker_evaluation scripts.tests.test_require_no_skips -v

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Verify the dev-only styleguide is absent from production
        working-directory: frontend
        run: node scripts/verify-no-styleguide.mjs

      - name: Verify frontend release contract
        run: ./scripts/test-frontend-release-contract.sh

      - name: Verify browser response-security contract
        run: ./scripts/test-browser-security-headers.sh

      - name: Verify link-preview web server contract
        run: ./scripts/test-link-previews.sh

      - name: Verify release security evidence contract
        run: ./scripts/test-release-security-contract.sh

      - name: Verify delivery boundary and local replacement contract
        run: ./scripts/test-deployment-contract.sh

      - name: Run release automation unit tests
        run: python3 -m unittest discover -s scripts/smoke/tests -v

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          MNEMA_TEST_WORKERS: '4'
        run: npm run test

  frontend-quality:
    if: ${{ always() }}
    needs: [frontend-checks, frontend-tests, release-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require every quality block
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['QUALITY_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Quality blocks did not all succeed: {failed}')
          PYCODE

