name: Database Recovery

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: Restore exact UTC backup ID or latest
        required: true
        default: latest
        type: string
      confirmation:
        description: Type RESTORE_IN_ISOLATED_NAMESPACE
        required: true
        type: string

permissions: {}

env:
  KUBECONFIG: ${{ github.workspace }}/kubeconfig-recovery
  RESTORE_NAMESPACE: mnema-restore-drill
  EVIDENCE_DIR: ${{ github.workspace }}/.recovery-evidence

concurrency:
  group: database-recovery-production
  cancel-in-progress: false

jobs:
  database-recovery:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: read
    environment:
      name: prod
      url: https://mnema.app
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject non-main or stale workflow revisions
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Database recovery operations run only from main"
            exit 1
          fi
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale recovery workflow ${GITHUB_SHA}; current main is ${current_main}"
            exit 1
          fi

      - name: Validate operation confirmation
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != RESTORE_IN_ISOLATED_NAMESPACE ]; then
            echo "::error::Exact isolated-restore confirmation is required"
            exit 1
          fi
          if [ "$BACKUP_ID" != latest ] && ! [[ "$BACKUP_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::backup_id must be latest or an exact UTC backup ID"
            exit 1
          fi

      - name: Validate required recovery secrets
        env:
          KUBECONFIG_B64: ${{ secrets.PROD_RECOVERY_KUBECONFIG_B64 }}
          AWS_ENDPOINT_URL: ${{ secrets.PROD_BACKUP_S3_ENDPOINT }}
          AWS_REGION: ${{ secrets.PROD_BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_BACKUP_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.PROD_BACKUP_S3_BUCKET }}
          S3_PREFIX: ${{ secrets.PROD_BACKUP_S3_PREFIX }}
          KMS_KEY_ID: ${{ secrets.PROD_BACKUP_KMS_KEY_ID }}
        run: |
          required_names="KUBECONFIG_B64 AWS_ENDPOINT_URL AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET S3_PREFIX KMS_KEY_ID"
          for name in $required_names; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required recovery secret ${name} is missing or empty"
              exit 1
            fi
          done
          if [ "$AWS_ENDPOINT_URL" != https://storage.yandexcloud.net ]; then
            echo "::error::Backup endpoint must be the Yandex Object Storage origin"
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.0

      - name: Write kubeconfig and verify the isolated recovery boundary
        env:
          KUBECONFIG_B64: ${{ secrets.PROD_RECOVERY_KUBECONFIG_B64 }}
        run: |
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          test "$(kubectl -n "$RESTORE_NAMESPACE" get configmap mnema-restore-boundary -o jsonpath='{.data.contractVersion}')" = 1
          test "$(kubectl -n "$RESTORE_NAMESPACE" get configmap mnema-restore-boundary -o jsonpath='{.data.targetNamespace}')" = "$RESTORE_NAMESPACE"
          test -n "$(kubectl -n "$RESTORE_NAMESPACE" get configmap kube-root-ca.crt -o jsonpath='{.data.ca\.crt}')"
          test "$(kubectl auth can-i get secrets -n "$RESTORE_NAMESPACE")" = no
          test "$(kubectl auth can-i create jobs.batch -n prod)" = no
          test "$(kubectl auth can-i delete namespaces)" = no
          mkdir -p "$EVIDENCE_DIR"

      - name: Refuse a busy restore boundary
        run: |
          busy_resources=$(kubectl -n "$RESTORE_NAMESPACE" get \
            pods,jobs.batch,statefulsets.apps,persistentvolumeclaims,services \
            -o name)
          mutable_configmaps=$(kubectl -n "$RESTORE_NAMESPACE" get configmaps -o name | \
            grep -Ev '^configmap/(mnema-restore-boundary|kube-root-ca\.crt)$' || true)
          if [ -n "$busy_resources" ] || [ -n "$mutable_configmaps" ]; then
            echo "::error::Restore boundary is not empty; inspect it before retrying"
            exit 1
          fi
          kubectl -n "$RESTORE_NAMESPACE" delete secret \
            mnema-restore-db-secrets mnema-restore-backup-secrets \
            --ignore-not-found=true

      - name: Create isolated restore drill resources
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          AWS_ENDPOINT_URL: ${{ secrets.PROD_BACKUP_S3_ENDPOINT }}
          AWS_REGION: ${{ secrets.PROD_BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_BACKUP_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.PROD_BACKUP_S3_BUCKET }}
          S3_PREFIX: ${{ secrets.PROD_BACKUP_S3_PREFIX }}
          KMS_KEY_ID: ${{ secrets.PROD_BACKUP_KMS_KEY_ID }}
        run: |
          drill_started_epoch=$(date -u +%s)
          db_password=$(openssl rand -hex 32)

          {
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: Secret' \
              'metadata:' \
              '  name: mnema-restore-db-secrets' \
              "  namespace: ${RESTORE_NAMESPACE}" \
              'type: Opaque' \
              'data:' \
              '  POSTGRES_DB: "bW5lbWFfcmVzdG9yZQ=="' \
              '  POSTGRES_USER: "bW5lbWFfcmVzdG9yZQ=="'
            encoded_password=$(printf '%s' "$db_password" | base64 | tr -d '\n')
            printf '  POSTGRES_PASSWORD: "%s"\n' "$encoded_password"
          } | kubectl create --request-timeout=30s -f -

          {
            printf '%s\n' \
              'apiVersion: v1' \
              'kind: Secret' \
              'metadata:' \
              '  name: mnema-restore-backup-secrets' \
              "  namespace: ${RESTORE_NAMESPACE}" \
              'type: Opaque' \
              'data:'
            for name in AWS_ENDPOINT_URL AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_BUCKET S3_PREFIX KMS_KEY_ID; do
              value=${!name}
              encoded=$(printf '%s' "$value" | base64 | tr -d '\n')
              printf '  %s: "%s"\n' "$name" "$encoded"
            done
          } | kubectl create --request-timeout=30s -f -

          kubectl -n "$RESTORE_NAMESPACE" create configmap mnema-backup-scripts \
            --from-file=scripts/backup/download.sh \
            --from-file=scripts/backup/restore.sh \
            --from-file=scripts/backup/reconcile.sql \
            --request-timeout=30s
          kubectl -n "$RESTORE_NAMESPACE" create configmap mnema-restore-config \
            --from-literal=BACKUP_ID="$BACKUP_ID" \
            --from-literal=DRILL_STARTED_EPOCH="$drill_started_epoch" \
            --request-timeout=30s
          kubectl create --request-timeout=30s -f k8s/backup/restore-drill.yaml

      - name: Wait for restore and validate reconciliation evidence
        if: ${{ success() && !cancelled() }}
        run: |
          report_restore_failure() {
            fallback=$1
            safe_error=''
            for container in download restore; do
              candidate=$(kubectl -n "$RESTORE_NAMESPACE" logs job/mnema-postgres-restore \
                --container="$container" --tail=200 --request-timeout=30s 2>/dev/null | \
                grep -E '^(download_error|restore_error)=[a-z0-9_]+$' | tail -1 || true)
              if [ -n "$candidate" ]; then
                safe_error=$candidate
              fi
            done
            echo "::error::${safe_error:-$fallback}"
            exit 1
          }

          kubectl -n "$RESTORE_NAMESPACE" rollout status statefulset/postgres \
            --timeout=10m
          restore_deadline_epoch=$(($(date -u +%s) + 7200))
          while true; do
            if ! restore_conditions=$(kubectl -n "$RESTORE_NAMESPACE" get job mnema-postgres-restore \
              --request-timeout=30s \
              -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}'); then
              report_restore_failure restore_job_status_unavailable
            fi
            if printf '%s\n' "$restore_conditions" | grep -Fxq 'Complete=True'; then
              break
            fi
            if printf '%s\n' "$restore_conditions" | grep -Fxq 'Failed=True'; then
              report_restore_failure restore_job_failed
            fi
            if [ "$(date -u +%s)" -ge "$restore_deadline_epoch" ]; then
              report_restore_failure restore_job_timeout
            fi
            sleep 5
          done
          kubectl -n "$RESTORE_NAMESPACE" logs job/mnema-postgres-restore \
            --container=restore --request-timeout=30s > "$EVIDENCE_DIR/restore-drill.json"
          python3 scripts/backup/validate_report.py \
            --kind restore-drill \
            --report "$EVIDENCE_DIR/restore-drill.json"

      - name: Remove only fixed restore drill resources
        if: ${{ always() }}
        timeout-minutes: 4
        run: |
          if [ ! -s "$KUBECONFIG" ]; then
            exit 0
          fi
          contract_version=$(kubectl -n "$RESTORE_NAMESPACE" get configmap mnema-restore-boundary \
            --request-timeout=10s -o jsonpath='{.data.contractVersion}' 2>/dev/null || true)
          if [ "$contract_version" != 1 ]; then
            echo "::error::Restore boundary marker is missing or changed; refusing cleanup"
            exit 1
          fi
          kubectl delete --request-timeout=10s -f k8s/backup/restore-drill.yaml \
            --ignore-not-found=true --wait=false
          kubectl -n "$RESTORE_NAMESPACE" delete configmap \
            mnema-backup-scripts mnema-restore-config \
            --ignore-not-found=true --wait=false --request-timeout=10s
          kubectl -n "$RESTORE_NAMESPACE" delete secret \
            mnema-restore-db-secrets mnema-restore-backup-secrets \
            --ignore-not-found=true --wait=false --request-timeout=10s

          cleanup_attempt=0
          while true; do
            leftover_workloads=$(kubectl -n "$RESTORE_NAMESPACE" get \
              pods,jobs.batch,statefulsets.apps,persistentvolumeclaims,services \
              --request-timeout=10s -o name)
            leftover_configmaps=$(kubectl -n "$RESTORE_NAMESPACE" get configmaps \
              --request-timeout=10s -o name | \
              grep -Ev '^configmap/(mnema-restore-boundary|kube-root-ca\.crt)$' || true)
            leftover_secrets=''
            for secret in mnema-restore-db-secrets mnema-restore-backup-secrets; do
              found=$(kubectl -n "$RESTORE_NAMESPACE" get "secret/$secret" \
                --ignore-not-found=true --request-timeout=10s -o name)
              if [ -n "$found" ]; then
                leftover_secrets="$leftover_secrets $found"
              fi
            done
            if [ -z "$leftover_workloads" ] && [ -z "$leftover_configmaps" ] && [ -z "$leftover_secrets" ]; then
              break
            fi
            cleanup_attempt=$((cleanup_attempt + 1))
            if [ "$cleanup_attempt" -ge 120 ]; then
              echo "::error::Fixed restore resources remain after cleanup"
              exit 1
            fi
            sleep 1
          done

      - name: Upload restore drill evidence
        if: ${{ always() && hashFiles('.recovery-evidence/restore-drill.json') != '' }}
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: database-restore-drill
          name: restore-drill-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/restore-drill.json
          if-no-files-found: error
          retention-days: 30
          classification: sanitized-recovery-evidence
