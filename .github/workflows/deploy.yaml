name: Main CI

on:
  push:
    branches: [main]
  # Manual dispatch releases the current main now, whether or not runtime paths changed.
  workflow_dispatch:

permissions: {}

jobs:
  validate-main-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require exact main branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo '::error::Main CI may run only for refs/heads/main.'
            exit 1
          fi

  release-scope:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether production runtime changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/release_scope.py

  backend-tests:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-ci-backend-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run isolated backend shard
        working-directory: backend
        run: ./gradlew test --parallel --max-workers=2 -PtestShard=${{ matrix.shard }}/8 -PtestForks=2

      - name: Collect bounded backend evidence
        run: python3 scripts/backend_test_evidence.py pack --index ${{ matrix.shard }}

      - name: Upload backend shard evidence
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: main-backend-shard
          name: backend-tests-${{ matrix.shard }}
          path: backend/build/ci-shard/
          retention-days: 7
          if-no-files-found: error
          classification: internal-test-report

  backend-security:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-ci-backend-security-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare cached PostgreSQL security fixture
        run: docker pull postgres:18

      - name: Verify Identity to Learning black-box security
        timeout-minutes: 15
        run: |
          ./backend/gradlew -p backend :services:identity-account:bootJar :services:learning:bootJar
          MNEMA_RUN_CANCELLATION_INTEGRATION=1 python3 -m unittest discover -s scripts/learning-security/tests -v
          python3 scripts/learning-security/run.py
          python3 scripts/learning-security/verify_cancellation.py

  backend-runtime:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-ci-backend-runtime-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up JDK 25 for the runtime readiness contract
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify VPS runtime and isolated local restore
        timeout-minutes: 5
        run: |
          docker build --tag mnema-vps-postgres-fixture:verified deploy/production
          python3 -m unittest discover -s scripts/tests -p 'test_vps_*.py' -v

      - name: Verify the media runner, the worker image and its codec matrix
        timeout-minutes: 15
        run: |
          # No skip is allowed in these suites: a missing tool must break the build, not turn the check into a no-op.
          python3 scripts/require_no_skips.py --path scripts/tests test_media_runner test_verify_production_dispatcher
          docker build --tag mnema-media-worker:verified backend/media-worker
          # The image carries no tests; they and the guard are mounted read-only. The codec matrix runs in the hardened
          # configuration the runner uses (no network, read-only root, no capability, tmpfs /tmp).
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 3g --cpus 2 --tmpfs /tmp:rw,size=512m,mode=1777 \
            --volume "$PWD/backend/media-worker/tests:/opt/mnema-media-worker/tests:ro" \
            --volume "$PWD/scripts/require_no_skips.py:/opt/require_no_skips.py:ro" --entrypoint python3 \
            mnema-media-worker:verified /opt/require_no_skips.py tests.test_worker

  backend-quality:
    if: ${{ always() }}
    needs: [backend-tests, backend-security, backend-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require every quality block
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['QUALITY_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Quality blocks did not all succeed: {failed}')
          PYCODE

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Discover the complete backend test inventory
        working-directory: backend
        run: ./gradlew testInventory --parallel --max-workers=2

      - name: Download backend shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-tests-*
          path: backend/build/ci-inputs

      - name: Verify shard completeness and combine execution data
        run: python3 scripts/backend_test_evidence.py merge

      - name: Enforce combined backend coverage
        working-directory: backend
        run: ./gradlew --parallel --max-workers=2 compileJava jacocoTestReport jacocoRootReport coverageBaselineCheck -PcoverageShards=8 -x test

      - name: Upload backend coverage report
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: main-backend-jacoco
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/jacocoRootReport/
          retention-days: 30
          if-no-files-found: warn
          classification: internal-test-report

  frontend-checks:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    concurrency:
      group: main-ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Verify GitHub automation policies
        run: |
          python3 scripts/verify_docs.py
          python3 scripts/verify_github_actions_pins.py
          python3 scripts/verify_security_automation_policy.py
          python3 scripts/verify_artifact_security_policy.py
          python3 scripts/verify_production_image_pins.py
          python3 -m unittest discover -s scripts/tests -p 'test_verify_*.py' -v
          # The remaining script suites; tests/test_verify_checks.py fails when a new suite is owned by no job.
          python3 -m unittest scripts.tests.test_ai_ops_metrics_snapshot scripts.tests.test_ai_worker_topology scripts.tests.test_local_full_stack_media scripts.tests.test_ranker_evaluation scripts.tests.test_require_no_skips -v

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Verify the dev-only styleguide is absent from production
        working-directory: frontend
        run: node scripts/verify-no-styleguide.mjs

      - name: Verify frontend release contract
        run: ./scripts/test-frontend-release-contract.sh

      - name: Verify browser response-security contract
        run: ./scripts/test-browser-security-headers.sh

      - name: Verify link-preview web server contract
        run: ./scripts/test-link-previews.sh

      - name: Verify release security evidence contract
        run: ./scripts/test-release-security-contract.sh

      - name: Verify delivery boundary and local replacement contract
        run: ./scripts/test-deployment-contract.sh

      - name: Run release automation unit tests
        run: python3 -m unittest discover -s scripts/smoke/tests -v

  frontend-tests:
    needs: validate-main-ref
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-ci-frontend-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          MNEMA_TEST_WORKERS: '4'
        run: npm run test

  frontend-quality:
    if: ${{ always() }}
    needs: [frontend-checks, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require every quality block
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['QUALITY_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Quality blocks did not all succeed: {failed}')
          PYCODE

  build-and-push:
    # Publish only when the release-scope job found a runtime change (or on manual dispatch).
    if: ${{ needs.release-scope.outputs.deploy == 'true' && github.ref == 'refs/heads/main' }}
    needs:
      - backend-quality
      - frontend-quality
      - release-scope
    runs-on: ubuntu-latest
    concurrency:
      group: main-ci-build-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - name: identity-account
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: identity-account-runtime

          - name: learning
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: learning-runtime

          - name: postgres
            context: ./deploy/production
            dockerfile: ./deploy/production/Dockerfile
            target: ""

          # FFmpeg image run one container per job by the root media runner (GPL-configured): its GHCR package must stay private, see backend/media-worker/README.md.
          - name: media-worker
            context: ./backend/media-worker
            dockerfile: ./backend/media-worker/Dockerfile
            target: ""

          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The docker-container builder does not read the daemon mirror; BuildKit gets its own.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Repo slug (lowercase)
        id: repo
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: echo "TAG=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        id: backend-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.name }}:${{ steps.meta.outputs.TAG }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image digest
        id: release-image
        env:
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.name }}
          SERVICE: ${{ matrix.name }}
        run: |
          digest="$BACKEND_DIGEST"
          case "$digest" in
            sha256:*) digest_hex=${digest#sha256:} ;;
            *)
              echo "::error::Missing or invalid digest for ${SERVICE}: ${digest}"
              exit 1
              ;;
          esac
          case "$digest_hex" in
            *[!0-9a-f]*)
              echo "::error::Invalid digest for ${SERVICE}: ${digest}"
              exit 1
              ;;
          esac
          if [ "${#digest_hex}" -ne 64 ]; then
            echo "::error::Unexpected digest length for ${SERVICE}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/release-digests"
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/release-digests/${SERVICE}.digest"
          {
            echo "digest=${digest}"
            echo "image-name=${IMAGE_NAME}"
            echo "image=${IMAGE_NAME}@${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract BuildKit SPDX SBOM for the exact digest
        env:
          IMAGE: ${{ steps.release-image.outputs.image }}
          SERVICE: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-security"
          docker buildx imagetools inspect "$IMAGE" \
            --format '{{ json .SBOM.SPDX }}' \
            > "$RUNNER_TEMP/release-security/${SERVICE}-sbom.spdx.json"

      - name: Create GitHub build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release-image.outputs.image-name }}
          subject-digest: ${{ steps.release-image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release-image.outputs.image-name }}
          subject-digest: ${{ steps.release-image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release-security/${{ matrix.name }}-sbom.spdx.json
          push-to-registry: true

      - name: Verify GitHub attestations against release identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release-image.outputs.image }}
          SERVICE: ${{ matrix.name }}
        run: |
          gh attestation verify "oci://${IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yaml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json \
            > "$RUNNER_TEMP/release-security/${SERVICE}-provenance-verification.json"
          gh attestation verify "oci://${IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yaml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json \
            > "$RUNNER_TEMP/release-security/${SERVICE}-sbom-verification.json"

      - name: Scan exact release digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.release-image.outputs.image }}
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/release-security/${{ matrix.name }}-trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          timeout: 10m
          version: v0.70.0
          cache: true
          trivyignores: security/trivy-release-ignore

      - name: Record scanner and vulnerability database identity
        env:
          IMAGE: ${{ steps.release-image.outputs.image }}
          SERVICE: ${{ matrix.name }}
        run: |
          trivy image "$IMAGE" \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --skip-db-update \
            --ignorefile security/trivy-release-ignore \
            --scanners vuln \
            --format sarif \
            --output "$RUNNER_TEMP/release-security/${SERVICE}-trivy-results.sarif" \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0
          trivy version \
            --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" \
            --format json \
            > "$RUNNER_TEMP/release-security/${SERVICE}-trivy-version.json"

      - name: Enforce release vulnerability policy
        env:
          IMAGE: ${{ steps.release-image.outputs.image }}
          SERVICE: ${{ matrix.name }}
        run: |
          python3 scripts/verify_release_security_evidence.py evaluate \
            --service "$SERVICE" \
            --image "$IMAGE" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID" \
            --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/release-security/${SERVICE}-trivy-report.json" \
            --sarif "$RUNNER_TEMP/release-security/${SERVICE}-trivy-results.sarif" \
            --scanner-metadata "$RUNNER_TEMP/release-security/${SERVICE}-trivy-version.json" \
            --exceptions security/release-image-exceptions.json \
            --trivy-ignore security/trivy-release-ignore \
            --sbom "$RUNNER_TEMP/release-security/${SERVICE}-sbom.spdx.json" \
            --provenance-verification "$RUNNER_TEMP/release-security/${SERVICE}-provenance-verification.json" \
            --sbom-verification "$RUNNER_TEMP/release-security/${SERVICE}-sbom-verification.json" \
            --output "$RUNNER_TEMP/release-security/${SERVICE}-security-evidence.json"

      - name: Upload full per-image security evidence
        if: ${{ always() }}
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: main-release-security
          name: release-security-${{ matrix.name }}
          path: ${{ runner.temp }}/release-security/${{ matrix.name }}-*
          if-no-files-found: warn
          retention-days: 30
          classification: security-evidence

      - name: Upload immutable image digest
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: main-release-image-digest
          name: release-image-${{ matrix.name }}
          path: ${{ runner.temp }}/release-digests/${{ matrix.name }}.digest
          if-no-files-found: error
          retention-days: 30
          classification: release-identifier

  assemble-vps-candidate:
    if: ${{ needs.release-scope.outputs.deploy == 'true' && github.ref == 'refs/heads/main' }}
    needs:
      - build-and-push
      - release-scope
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require candidate to remain current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"

      - name: Download immutable image identifiers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-digests
          merge-multiple: true

      - name: Download verified image evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-security-*
          path: ${{ runner.temp }}/release-security
          merge-multiple: true

      - name: Bind the five images to this source and build run
        run: |
          python3 scripts/verify_release_security_evidence.py aggregate --include-frontend \
            --evidence-dir "$RUNNER_TEMP/release-security" \
            --digests-dir "$RUNNER_TEMP/release-digests" \
            --exceptions security/release-image-exceptions.json \
            --trivy-ignore security/trivy-release-ignore \
            --repository "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" \
            --build-run-id "$GITHUB_RUN_ID" --build-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/vps-security-evidence.json"
          python3 scripts/render_vps_candidate.py \
            --evidence "$RUNNER_TEMP/vps-security-evidence.json" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trivy-ignore security/trivy-release-ignore \
            --output "$RUNNER_TEMP/vps-candidate.json"
          (cd "$RUNNER_TEMP" && sha256sum vps-candidate.json vps-security-evidence.json > vps-candidate.sha256)

      - name: Upload VPS candidate
        uses: ./.github/actions/safe-upload-artifact
        with:
          policy-id: main-vps-candidate
          name: vps-candidate
          path: |
            ${{ runner.temp }}/vps-candidate.json
            ${{ runner.temp }}/vps-security-evidence.json
            ${{ runner.temp }}/vps-candidate.sha256
          if-no-files-found: error
          retention-days: 30
          classification: release-manifest

  deploy-production:
    needs: assemble-vps-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: mnema-vps-production
      cancel-in-progress: false
    environment:
      name: prod
      url: https://mnema.app
    # Exactly the four read scopes enforced by scripts/verify_artifact_security_policy.py. This token also travels,
    # short-lived, to the host's `pull`: all four are read-only, `packages: read` is the one that matters there.
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Checkout reviewed deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download VPS candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vps-candidate
          path: ${{ runner.temp }}/vps-candidate

      - name: Log in to GHCR for attestation lookup
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-verify candidate integrity and image attestations after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/vps-candidate"
          sha256sum --check --strict vps-candidate.sha256
          images=$(python3 -I - <<'PY'
          import hashlib, json, os, re, sys
          candidate = json.load(open('vps-candidate.json'))
          sha, run_id = os.environ['GITHUB_SHA'], int(os.environ['GITHUB_RUN_ID'])
          source = candidate['source']
          if candidate['sha'] != sha or source['commit'] != sha or source['runId'] != run_id:
              sys.exit('candidate does not belong to this workflow run')
          if candidate['securityEvidenceSha256'] != hashlib.sha256(open('vps-security-evidence.json', 'rb').read()).hexdigest():
              sys.exit('candidate evidence hash differs')
          pattern = re.compile(r'ghcr\.io/mattoyuzuru/mnema/(frontend|identity-account|learning|media-worker|postgres)@sha256:[0-9a-f]{64}')
          if sorted(candidate['images']) != ['frontend', 'identity-account', 'learning', 'media-worker', 'postgres'] \
                  or not all(pattern.fullmatch(image) for image in candidate['images'].values()):
              sys.exit('candidate images are not the five reviewed identities')
          print('\n'.join(candidate['images'].values()))
          PY
          )
          test "$(printf '%s\n' "$images" | wc -l)" -eq 5
          for image in $images; do
            for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
              gh attestation verify "oci://${image}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yaml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners \
                --predicate-type "$predicate" \
                > /dev/null
            done
          done

      - name: Configure, admit, deploy and verify on the production host
        env:
          GH_TOKEN: ${{ github.token }}
          MNEMA_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          MNEMA_DEPLOY_USER: ${{ vars.PROD_DEPLOY_USER }}
          MNEMA_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          MNEMA_DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
          # Application configuration allowlist (deploy/production/app-config.keys), explicit on purpose.
          PROD_TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          PROD_TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          PROD_GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          PROD_GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          PROD_YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          PROD_YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          PROD_GH_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          PROD_GH_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          PROD_MNEMA_POSTBOX_ACCESS_KEY: ${{ secrets.PROD_MNEMA_POSTBOX_ACCESS_KEY }}
          PROD_MNEMA_POSTBOX_SECRET_KEY: ${{ secrets.PROD_MNEMA_POSTBOX_SECRET_KEY }}
          PROD_MNEMA_PROMO_HASH_SECRET: ${{ secrets.PROD_MNEMA_PROMO_HASH_SECRET }}
          PROD_MNEMA_EXPERIMENT_SECRET: ${{ secrets.PROD_MNEMA_EXPERIMENT_SECRET }}
          PROD_MNEMA_EVENTS_OWNER_ACCOUNT_ID: ${{ secrets.PROD_MNEMA_EVENTS_OWNER_ACCOUNT_ID }}
          PROD_MNEMA_ADMIN_OWNER_ACCOUNT_ID: ${{ secrets.PROD_MNEMA_ADMIN_OWNER_ACCOUNT_ID }}
          PROD_MNEMA_IDENTITY_ADMIN_ORIGIN: ${{ secrets.PROD_MNEMA_IDENTITY_ADMIN_ORIGIN }}
          PROD_MNEMA_ADMIN_SUPPORT_ENDPOINT: ${{ secrets.PROD_MNEMA_ADMIN_SUPPORT_ENDPOINT }}
          PROD_MNEMA_ADMIN_SUPPORT_SECRET: ${{ secrets.PROD_MNEMA_ADMIN_SUPPORT_SECRET }}
          PROD_MNEMA_IDENTITY_TURNSTILE_MODE: ${{ secrets.PROD_MNEMA_IDENTITY_TURNSTILE_MODE }}
          PROD_LEARNING_MEDIA_UPLOAD_ACCESS_KEY: ${{ secrets.PROD_LEARNING_MEDIA_UPLOAD_ACCESS_KEY }}
          PROD_LEARNING_MEDIA_UPLOAD_SECRET_KEY: ${{ secrets.PROD_LEARNING_MEDIA_UPLOAD_SECRET_KEY }}
          PROD_MNEMA_AVATAR_ACCESS_KEY: ${{ secrets.PROD_MNEMA_AVATAR_ACCESS_KEY }}
          PROD_MNEMA_AVATAR_SECRET_KEY: ${{ secrets.PROD_MNEMA_AVATAR_SECRET_KEY }}
          PROD_MNEMA_BILLING_CHECKOUT: ${{ secrets.PROD_MNEMA_BILLING_CHECKOUT }}
          PROD_MNEMA_BILLING_TESTER_ACCOUNT_IDS: ${{ secrets.PROD_MNEMA_BILLING_TESTER_ACCOUNT_IDS }}
          PROD_MNEMA_TBANK_TERMINAL_KEY: ${{ secrets.PROD_MNEMA_TBANK_TERMINAL_KEY }}
          PROD_MNEMA_TBANK_PASSWORD_BASE64: ${{ secrets.PROD_MNEMA_TBANK_PASSWORD_BASE64 }}
          PROD_MNEMA_NPD_RECEIPTS: ${{ secrets.PROD_MNEMA_NPD_RECEIPTS }}
          PROD_MNEMA_NPD_INN: ${{ secrets.PROD_MNEMA_NPD_INN }}
          PROD_MNEMA_NPD_PASSWORD_BASE64: ${{ secrets.PROD_MNEMA_NPD_PASSWORD_BASE64 }}
          PROD_MNEMA_AI_DEEPSEEK_API_KEY: ${{ secrets.PROD_MNEMA_AI_DEEPSEEK_API_KEY }}
          PROD_MNEMA_AI_OPENROUTER_API_KEY: ${{ secrets.PROD_MNEMA_AI_OPENROUTER_API_KEY }}
          PROD_MNEMA_AI_GOOGLE_API_KEY: ${{ secrets.PROD_MNEMA_AI_GOOGLE_API_KEY }}
          PROD_MNEMA_AI_PIXABAY_API_KEY: ${{ secrets.PROD_MNEMA_AI_PIXABAY_API_KEY }}
          PROD_MNEMA_AI_OPENVERSE_CLIENT_ID: ${{ secrets.PROD_MNEMA_AI_OPENVERSE_CLIENT_ID }}
          PROD_MNEMA_AI_OPENVERSE_CLIENT_SECRET: ${{ secrets.PROD_MNEMA_AI_OPENVERSE_CLIENT_SECRET }}
          PROD_MNEMA_AI_YANDEX_SEARCH_API_KEY: ${{ secrets.PROD_MNEMA_AI_YANDEX_SEARCH_API_KEY }}
          PROD_MNEMA_AI_YANDEX_FOLDER_ID: ${{ secrets.PROD_MNEMA_AI_YANDEX_FOLDER_ID }}
        run: bash scripts/deploy-vps.sh "$RUNNER_TEMP/vps-candidate/vps-candidate.json"

  post-deploy-smoke:
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed smoke revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke the public production surface
        run: python3 -I scripts/smoke/vps_public_smoke.py --sha "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"
