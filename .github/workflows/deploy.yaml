name: Main CI

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: main-ci-backend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend quality gate
        working-directory: backend
        run: ./gradlew quality

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/jacocoRootReport/

  frontend-quality:
    runs-on: ubuntu-latest
    concurrency:
      group: main-ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Verify frontend release contract
        run: ./scripts/test-frontend-release-contract.sh

      - name: Verify release manifest renderer
        run: ./scripts/test-render-release-manifest.sh

      - name: Verify environment isolation contract
        run: ./scripts/test-deployment-contract.sh

      - name: Run release automation unit tests
        run: python3 -m unittest discover -s scripts/smoke/tests -v

  build-and-push:
    needs:
      - backend-quality
      - frontend-quality
    runs-on: ubuntu-latest
    concurrency:
      group: main-ci-build-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            kind: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - name: auth
            kind: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: auth-runtime

          - name: user
            kind: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: user-runtime

          - name: core
            kind: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: core-runtime

          - name: media
            kind: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: media-runtime

          - name: import
            kind: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: import-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Repo slug (lowercase)
        id: repo
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: meta
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend
        if: ${{ matrix.kind == 'frontend' }}
        id: frontend-image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.name }}:${{ steps.meta.outputs.TAG }}
            ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push backend ${{ matrix.name }}
        if: ${{ matrix.kind == 'backend' }}
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.name }}:${{ steps.meta.outputs.TAG }}
            ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Record immutable image digest
        env:
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          digest="${FRONTEND_DIGEST:-$BACKEND_DIGEST}"
          case "$digest" in
            sha256:*) digest_hex=${digest#sha256:} ;;
            *)
              echo "::error::Missing or invalid digest for ${IMAGE_NAME}: ${digest}"
              exit 1
              ;;
          esac
          case "$digest_hex" in
            *[!0-9a-f]*)
              echo "::error::Invalid digest for ${IMAGE_NAME}: ${digest}"
              exit 1
              ;;
          esac
          if [ "${#digest_hex}" -ne 64 ]; then
            echo "::error::Unexpected digest length for ${IMAGE_NAME}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/release-digests"
          printf '%s\n' "$digest" > "${RUNNER_TEMP}/release-digests/${IMAGE_NAME}.digest"

      - name: Upload immutable image digest
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ matrix.name }}
          path: ${{ runner.temp }}/release-digests/${{ matrix.name }}.digest
          if-no-files-found: error
          retention-days: 30

  render-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v6

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-digests
          merge-multiple: true

      - name: Render immutable production release
        env:
          DIGEST_DIR: ${{ runner.temp }}/release-digests
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          OUTPUT: ${{ runner.temp }}/production-release.yaml
          RELEASE_SHA: ${{ github.sha }}
        run: |
          IMAGE_BASE=$(printf '%s' "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')
          export IMAGE_BASE
          ./scripts/render-release-manifest.sh
          output_dir=$(dirname -- "$OUTPUT")
          output_name=$(basename -- "$OUTPUT")
          (cd "$output_dir" && sha256sum "$output_name" > "${output_name}.sha256")

      - name: Render immutable staging release from the same digests
        env:
          APP_ENV: staging
          AUTH_HOST: auth.staging.mnema.app
          DIGEST_DIR: ${{ runner.temp }}/release-digests
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          OUTPUT: ${{ runner.temp }}/staging-release.yaml
          PUBLIC_HOST: staging.mnema.app
          RELEASE_NAMESPACE: mnema-staging
          RELEASE_SHA: ${{ github.sha }}
          S3_ENDPOINT: http://minio:9000
          S3_PATH_STYLE_ACCESS: "true"
          S3_PUBLIC_ENDPOINT: https://storage.staging.mnema.app
          SPRING_PROFILES: prod
        run: |
          IMAGE_BASE=$(printf '%s' "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')
          export IMAGE_BASE
          ./scripts/render-release-manifest.sh
          output_dir=$(dirname -- "$OUTPUT")
          output_name=$(basename -- "$OUTPUT")
          (cd "$output_dir" && sha256sum "$output_name" > "${output_name}.sha256")

      - name: Upload complete release manifest
        uses: actions/upload-artifact@v7
        with:
          name: production-release-manifest
          path: |
            ${{ runner.temp }}/production-release.yaml
            ${{ runner.temp }}/production-release.yaml.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload staging release manifest
        uses: actions/upload-artifact@v7
        with:
          name: staging-release-manifest
          path: |
            ${{ runner.temp }}/staging-release.yaml
            ${{ runner.temp }}/staging-release.yaml.sha256
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    needs: render-release
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/staging-deploy.yaml
    with:
      release_sha: ${{ github.sha }}

  deploy-production:
    needs: deploy-staging
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/production-deploy.yaml
    with:
      release_sha: ${{ github.sha }}
