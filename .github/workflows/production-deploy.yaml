name: Production Deploy

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact tested and built main revision to deploy
        required: true
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preview-production:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment:
      name: prod
      deployment: false
    outputs:
      release_diff_sha256: ${{ steps.preview.outputs.release_diff_sha256 }}
      has_release_changes: ${{ steps.preview.outputs.has_release_changes }}
      secret_drift: ${{ steps.secret-preview.outputs.secret_drift }}
      secret_snapshot_hmac: ${{ steps.secret-preview.outputs.secret_snapshot_hmac }}
      live_secret_snapshot_hmac: ${{ steps.secret-preview.outputs.live_secret_snapshot_hmac }}
      app_secret_generation: ${{ steps.secret-preview.outputs.app_secret_generation }}
      grafana_secret_generation: ${{ steps.secret-preview.outputs.grafana_secret_generation }}
      preview_artifact_id: ${{ steps.upload-preview.outputs.artifact-id }}
      preview_artifact_digest: ${{ steps.upload-preview.outputs.artifact-digest }}
    env:
      NS: prod
      KUBECONFIG: ${{ github.workspace }}/kubeconfig-main
      RELEASE_MANIFEST: ${{ github.workspace }}/production-release.yaml
      RELEASE_DIFF: ${{ github.workspace }}/production-release.diff
      RELEASE_PREVIEW_METADATA: ${{ github.workspace }}/production-release-preview.txt
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Download complete release manifest
        uses: actions/download-artifact@v8
        with:
          name: production-release-manifest
          path: ${{ github.workspace }}

      - name: Verify release artifact integrity
        working-directory: ${{ github.workspace }}
        run: sha256sum --check production-release.yaml.sha256

      - name: Reject a stale release
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale release ${RELEASE_SHA}; current main is ${current_main}"
            exit 1
          fi

      - name: Validate required production secrets
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.PROD_GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.PROD_GF_SECURITY_ADMIN_PASSWORD }}
          RELEASE_BINDING_KEY: ${{ secrets.PROD_RELEASE_BINDING_KEY }}
        run: |
          required_names="AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD RELEASE_BINDING_KEY SMOKE_LOGIN SMOKE_PASSWORD SMOKE_TURNSTILE_BYPASS_KEY"
          for name in $required_names; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production secret ${name} is missing or empty"
              exit 1
            fi
          done
          if [ "$AUTH_ISSUER" != "https://auth.mnema.app" ] || [ "$AUTH_ISSUER_URI" != "$AUTH_ISSUER" ]; then
            echo "::error::Production issuer secrets must identify auth.mnema.app"
            exit 1
          fi
          if [ "$POSTGRES_DB" != mnema ]; then
            echo "::error::PROD_POSTGRES_DB must match the release database contract"
            exit 1
          fi
          if [ "${#SMOKE_TURNSTILE_BYPASS_KEY}" -lt 32 ]; then
            echo "::error::PROD_SMOKE_TURNSTILE_BYPASS_KEY must contain at least 32 characters"
            exit 1
          fi

      - name: Write kubeconfig (main cluster)
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          if [ -z "$PROD_KUBECONFIG_B64" ]; then
            echo "::error::PROD_KUBECONFIG_B64 is required in the prod environment"
            exit 1
          fi
          printf '%s' "$PROD_KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Detect production Secret drift without exposing values
        id: secret-preview
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.PROD_GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.PROD_GF_SECURITY_ADMIN_PASSWORD }}
          SECRET_SNAPSHOT_BINDING_KEY: ${{ secrets.PROD_RELEASE_BINDING_KEY }}
        run: |
          ./scripts/verify-kubernetes-bootstrap-secret-values.py \
            production "$NS" mnema-secrets \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN >/dev/null
          ./scripts/verify-kubernetes-bootstrap-secret-values.py \
            production observability grafana-secrets \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD >/dev/null
          app_drift=$(./scripts/detect-kubernetes-secret-drift.py \
            "$NS" mnema-secrets \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
            YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN \
            SMOKE_LOGIN SMOKE_TURNSTILE_BYPASS_KEY)
          grafana_drift=$(./scripts/detect-kubernetes-secret-drift.py \
            observability grafana-secrets \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD)
          app_secret_generation=$(./scripts/create-secret-snapshot-binding.py \
            production-application-secret-generation:v1 \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
            YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN \
            SMOKE_LOGIN SMOKE_TURNSTILE_BYPASS_KEY)
          grafana_secret_generation=$(./scripts/create-secret-snapshot-binding.py \
            production-grafana-secret-generation:v1 \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD)
          app_marker_drift=$(./scripts/detect-kubernetes-reconciliation-drift.py \
            "$NS" mnema-secret-reconciliation applicationGeneration \
            "$app_secret_generation")
          grafana_marker_drift=$(./scripts/detect-kubernetes-reconciliation-drift.py \
            "$NS" mnema-secret-reconciliation grafanaGeneration \
            "$grafana_secret_generation")
          if [ "$app_drift" = true ] || [ "$app_marker_drift" = true ] || \
             [ "$grafana_drift" = true ] || [ "$grafana_marker_drift" = true ]; then
            secret_drift=true
          else
            secret_drift=false
          fi
          secret_snapshot_hmac=$(./scripts/create-secret-snapshot-binding.py \
            "production:${RELEASE_SHA}" \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
            YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD \
            SMOKE_LOGIN SMOKE_PASSWORD SMOKE_TURNSTILE_BYPASS_KEY)
          live_snapshot=$(./scripts/create-kubernetes-live-release-binding.py \
            "production:${RELEASE_SHA}" \
            "$NS/mnema-secrets" observability/grafana-secrets \
            "$NS/mnema-secret-reconciliation")
          live_secret_snapshot_hmac=$(printf '%s' "$live_snapshot" | jq -r '.hmac')
          {
            printf 'secret_drift=%s\n' "$secret_drift"
            printf 'secret_snapshot_hmac=%s\n' "$secret_snapshot_hmac"
            printf 'live_secret_snapshot_hmac=%s\n' "$live_secret_snapshot_hmac"
            printf 'app_secret_generation=%s\n' "$app_secret_generation"
            printf 'grafana_secret_generation=%s\n' "$grafana_secret_generation"
          } >> "$GITHUB_OUTPUT"
          printf 'Production Secret drift: %s\n' "$secret_drift"

      - name: Capture complete application release preview
        id: preview
        env:
          SECRET_DRIFT: ${{ steps.secret-preview.outputs.secret_drift }}
          SECRET_SNAPSHOT_HMAC: ${{ steps.secret-preview.outputs.secret_snapshot_hmac }}
          LIVE_SECRET_SNAPSHOT_HMAC: ${{ steps.secret-preview.outputs.live_secret_snapshot_hmac }}
          APP_SECRET_GENERATION: ${{ steps.secret-preview.outputs.app_secret_generation }}
          GRAFANA_SECRET_GENERATION: ${{ steps.secret-preview.outputs.grafana_secret_generation }}
        run: |
          release_diff_sha256=$(./scripts/capture-release-diff.sh \
            "$RELEASE_MANIFEST" "$RELEASE_DIFF")
          release_manifest_sha256=$(awk '{print $1}' production-release.yaml.sha256)
          kubectl_version=$(kubectl version --client -o json | \
            jq -r '.clientVersion.gitVersion')
          if grep -Fxq 'No application release changes.' "$RELEASE_DIFF"; then
            application_release_changes=false
          else
            application_release_changes=true
          fi
          if [ "$application_release_changes" = true ] || [ "$SECRET_DRIFT" = true ]; then
            has_release_changes=true
          else
            has_release_changes=false
          fi

          cat > "$RELEASE_PREVIEW_METADATA" <<EOF
          release_sha=${RELEASE_SHA}
          release_manifest_sha256=${release_manifest_sha256}
          release_diff_sha256=${release_diff_sha256}
          application_release_changes=${application_release_changes}
          secret_drift=${SECRET_DRIFT}
          secret_snapshot_hmac=${SECRET_SNAPSHOT_HMAC}
          live_secret_snapshot_hmac=${LIVE_SECRET_SNAPSHOT_HMAC}
          app_secret_generation=${APP_SECRET_GENERATION}
          grafana_secret_generation=${GRAFANA_SECRET_GENERATION}
          has_release_changes=${has_release_changes}
          kubectl_version=${kubectl_version}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          EOF

          printf 'release_diff_sha256=%s\n' "$release_diff_sha256" >> "$GITHUB_OUTPUT"
          printf 'has_release_changes=%s\n' "$has_release_changes" >> "$GITHUB_OUTPUT"
          printf 'Release %s has reviewable diff %s\n' \
            "$RELEASE_SHA" "$release_diff_sha256"

      - name: Upload sanitized production release preview
        id: upload-preview
        uses: actions/upload-artifact@v7
        with:
          name: production-release-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_DIFF }}
            ${{ env.RELEASE_PREVIEW_METADATA }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish production review instructions
        env:
          PREVIEW_ARTIFACT_ID: ${{ steps.upload-preview.outputs.artifact-id }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.upload-preview.outputs.artifact-digest }}
          HAS_RELEASE_CHANGES: ${{ steps.preview.outputs.has_release_changes }}
          SECRET_DRIFT: ${{ steps.secret-preview.outputs.secret_drift }}
          RELEASE_DIFF_SHA256: ${{ steps.preview.outputs.release_diff_sha256 }}
        run: |
          {
            printf '## Production release preview\n\n'
            printf -- '- Release: %s\n' "$RELEASE_SHA"
            printf -- '- Diff SHA-256: %s\n' "$RELEASE_DIFF_SHA256"
            printf -- '- Artifact ID: %s\n' "$PREVIEW_ARTIFACT_ID"
            printf -- '- Artifact digest: %s\n' "$PREVIEW_ARTIFACT_DIGEST"
            printf -- '- Changes: %s\n\n' "$HAS_RELEASE_CHANGES"
            printf -- '- Secret drift (values hidden): %s\n\n' "$SECRET_DRIFT"
            if [ "$HAS_RELEASE_CHANGES" = true ]; then
              printf 'Inspect the preview artifact. Reject the next prod approval if any change is unexpected.\n'
            else
              printf 'The mutating job will be skipped because the release is already applied.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: preview-production
    if: needs.preview-production.outputs.has_release_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment:
      name: prod
      url: https://mnema.app
      deployment: true
    env:
      NS: prod
      KUBECONFIG: ${{ github.workspace }}/kubeconfig-main
      RELEASE_MANIFEST: ${{ github.workspace }}/production-release.yaml
      RELEASE_DIFF: ${{ github.workspace }}/production-release.diff
      APPROVED_PREVIEW_DIR: ${{ github.workspace }}/approved-production-preview
      RELEASE_RECORD: ${{ github.workspace }}/.release-state/production-release-record.json
      ROLLBACK_MANIFEST: ${{ github.workspace }}/.release-state/production-rollback-release.yaml
      ROLLBACK_RECORD: ${{ github.workspace }}/.release-state/production-rollback-record.json
      ROLLBACK_APP_SECRET: ${{ github.workspace }}/.release-state/production-rollback-application-secret.json
      ROLLBACK_SMOKE_REPORT: ${{ github.workspace }}/.release-state/production-rollback-smoke-report.json
      SMOKE_REPORT: ${{ github.workspace }}/.release-state/production-smoke-report.json
      DIAGNOSTICS_DIR: ${{ github.workspace }}/.release-state/production-release-diagnostics
      AUTO_ROLLBACK_ENABLED: ${{ vars.AUTO_ROLLBACK_ENABLED || 'true' }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Download complete release manifest
        uses: actions/download-artifact@v8
        with:
          name: production-release-manifest
          path: ${{ github.workspace }}

      - name: Validate approved preview artifact reference
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ARTIFACT_ID: ${{ needs.preview-production.outputs.preview_artifact_id }}
          PREVIEW_ARTIFACT_DIGEST: ${{ needs.preview-production.outputs.preview_artifact_digest }}
        run: |
          case "$PREVIEW_ARTIFACT_ID" in
            ''|*[!0-9]*)
              echo "::error::Approved preview artifact ID is missing or invalid"
              exit 1
              ;;
          esac
          case "$PREVIEW_ARTIFACT_DIGEST" in
            sha256:*) expected_digest="$PREVIEW_ARTIFACT_DIGEST" ;;
            *) expected_digest="sha256:${PREVIEW_ARTIFACT_DIGEST}" ;;
          esac

          artifact=$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREVIEW_ARTIFACT_ID}")
          server_id=$(printf '%s' "$artifact" | jq -r '.id')
          server_name=$(printf '%s' "$artifact" | jq -r '.name')
          server_digest=$(printf '%s' "$artifact" | jq -r '.digest')
          server_expired=$(printf '%s' "$artifact" | jq -r '.expired')
          server_run_id=$(printf '%s' "$artifact" | jq -r '.workflow_run.id')

          if [ "$server_id" != "$PREVIEW_ARTIFACT_ID" ] || \
             [ "$server_name" != "production-release-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ] || \
             [ "$server_digest" != "$expected_digest" ] || \
             [ "$server_expired" != false ] || \
             [ "$server_run_id" != "$GITHUB_RUN_ID" ]; then
            echo "::error::Approved preview artifact identity, digest, run or lifetime changed"
            exit 1
          fi

      - name: Download approved production preview by immutable ID
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preview-production.outputs.preview_artifact_id }}
          path: ${{ env.APPROVED_PREVIEW_DIR }}
          digest-mismatch: error

      - name: Verify release artifact integrity
        working-directory: ${{ github.workspace }}
        run: sha256sum --check production-release.yaml.sha256

      - name: Verify approved production preview contents
        run: |
          ./scripts/verify-release-preview.sh \
            "$APPROVED_PREVIEW_DIR/production-release-preview.txt" \
            "$APPROVED_PREVIEW_DIR/production-release.diff" \
            production-release.yaml.sha256 \
            "$RELEASE_SHA" \
            '${{ needs.preview-production.outputs.release_diff_sha256 }}' \
            v1.36.0 \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" \
            '${{ needs.preview-production.outputs.secret_drift }}' \
            '${{ needs.preview-production.outputs.secret_snapshot_hmac }}' \
            '${{ needs.preview-production.outputs.live_secret_snapshot_hmac }}' \
            '${{ needs.preview-production.outputs.app_secret_generation }}' \
            '${{ needs.preview-production.outputs.grafana_secret_generation }}' \
            true

      - name: Reject a stale release
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale release ${RELEASE_SHA}; current main is ${current_main}"
            exit 1
          fi

      - name: Validate required production secrets before mutation
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.PROD_GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.PROD_GF_SECURITY_ADMIN_PASSWORD }}
          RELEASE_BINDING_KEY: ${{ secrets.PROD_RELEASE_BINDING_KEY }}
        run: |
          required_names="AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD RELEASE_BINDING_KEY SMOKE_LOGIN SMOKE_PASSWORD SMOKE_TURNSTILE_BYPASS_KEY"
          for name in $required_names; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production secret ${name} is missing or empty"
              exit 1
            fi
          done
          if [ "$AUTH_ISSUER" != "https://auth.mnema.app" ] || [ "$AUTH_ISSUER_URI" != "$AUTH_ISSUER" ]; then
            echo "::error::Production issuer secrets must identify auth.mnema.app"
            exit 1
          fi
          if [ "$POSTGRES_DB" != mnema ]; then
            echo "::error::PROD_POSTGRES_DB must match the release database contract"
            exit 1
          fi
          case "$AUTO_ROLLBACK_ENABLED" in
            true | false) ;;
            *)
              echo "::error::AUTO_ROLLBACK_ENABLED must be true or false"
              exit 1
              ;;
          esac
          if [ "${#SMOKE_TURNSTILE_BYPASS_KEY}" -lt 32 ]; then
            echo "::error::PROD_SMOKE_TURNSTILE_BYPASS_KEY must contain at least 32 characters"
            exit 1
          fi

      - name: Verify approved desired Secret snapshot before cluster access
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.PROD_GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.PROD_GF_SECURITY_ADMIN_PASSWORD }}
          SECRET_SNAPSHOT_BINDING_KEY: ${{ secrets.PROD_RELEASE_BINDING_KEY }}
          APPROVED_SECRET_SNAPSHOT_HMAC: ${{ needs.preview-production.outputs.secret_snapshot_hmac }}
        run: |
          current_secret_snapshot_hmac=$(./scripts/create-secret-snapshot-binding.py \
            "production:${RELEASE_SHA}" \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
            YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD \
            SMOKE_LOGIN SMOKE_PASSWORD SMOKE_TURNSTILE_BYPASS_KEY)
          if [ "$current_secret_snapshot_hmac" != "$APPROVED_SECRET_SNAPSHOT_HMAC" ]; then
            echo "::error::Desired production Secret snapshot changed after approval"
            exit 1
          fi

      - name: Write kubeconfig (main cluster)
        env:
          PROD_KUBECONFIG_B64: ${{ secrets.PROD_KUBECONFIG_B64 }}
        run: |
          if [ -z "$PROD_KUBECONFIG_B64" ]; then
            echo "::error::PROD_KUBECONFIG_B64 is required in the prod environment"
            exit 1
          fi
          printf '%s' "$PROD_KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

      - name: Reject release or cluster drift after approval
        id: drift-guard
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.PROD_GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.PROD_GF_SECURITY_ADMIN_PASSWORD }}
          SECRET_SNAPSHOT_BINDING_KEY: ${{ secrets.PROD_RELEASE_BINDING_KEY }}
        run: |
          approved_diff_sha256='${{ needs.preview-production.outputs.release_diff_sha256 }}'
          ./scripts/capture-release-diff.sh \
            "$RELEASE_MANIFEST" "$RELEASE_DIFF" "$approved_diff_sha256"
          live_snapshot=$(./scripts/create-kubernetes-live-release-binding.py \
            "production:${RELEASE_SHA}" \
            "$NS/mnema-secrets" observability/grafana-secrets \
            "$NS/mnema-secret-reconciliation")
          current_live_snapshot_hmac=$(printf '%s' "$live_snapshot" | jq -r '.hmac')
          approved_live_snapshot_hmac='${{ needs.preview-production.outputs.live_secret_snapshot_hmac }}'
          if [ "$current_live_snapshot_hmac" != "$approved_live_snapshot_hmac" ]; then
            echo "::error::Live production Secret or reconciliation state changed after approval"
            exit 1
          fi
          app_secret_resource_version=$(printf '%s' "$live_snapshot" | \
            jq -r '.resourceVersions["prod/mnema-secrets"] // empty')
          reconciliation_resource_version=$(printf '%s' "$live_snapshot" | \
            jq -r '.resourceVersions["prod/mnema-secret-reconciliation"] // empty')
          app_drift=$(./scripts/detect-kubernetes-secret-drift.py \
            "$NS" mnema-secrets \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
            YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN \
            SMOKE_LOGIN SMOKE_TURNSTILE_BYPASS_KEY)
          grafana_drift=$(./scripts/detect-kubernetes-secret-drift.py \
            observability grafana-secrets \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD)
          app_secret_generation=$(./scripts/create-secret-snapshot-binding.py \
            production-application-secret-generation:v1 \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET \
            YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN \
            SMOKE_LOGIN SMOKE_TURNSTILE_BYPASS_KEY)
          grafana_secret_generation=$(./scripts/create-secret-snapshot-binding.py \
            production-grafana-secret-generation:v1 \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD)
          if [ "$app_secret_generation" != '${{ needs.preview-production.outputs.app_secret_generation }}' ] || \
             [ "$grafana_secret_generation" != '${{ needs.preview-production.outputs.grafana_secret_generation }}' ]; then
            echo "::error::Production Secret reconciliation generation changed after approval"
            exit 1
          fi
          app_marker_drift=$(./scripts/detect-kubernetes-reconciliation-drift.py \
            "$NS" mnema-secret-reconciliation applicationGeneration \
            "$app_secret_generation")
          grafana_marker_drift=$(./scripts/detect-kubernetes-reconciliation-drift.py \
            "$NS" mnema-secret-reconciliation grafanaGeneration \
            "$grafana_secret_generation")
          if [ "$app_drift" = true ] || [ "$app_marker_drift" = true ] || \
             [ "$grafana_drift" = true ] || [ "$grafana_marker_drift" = true ]; then
            current_secret_drift=true
          else
            current_secret_drift=false
          fi
          approved_secret_drift='${{ needs.preview-production.outputs.secret_drift }}'
          if [ "$current_secret_drift" != "$approved_secret_drift" ]; then
            echo "::error::Production Secret drift state changed after approval"
            exit 1
          fi
          ./scripts/verify-kubernetes-bootstrap-secret-values.py \
            production "$NS" mnema-secrets \
            AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY \
            POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN >/dev/null
          ./scripts/verify-kubernetes-bootstrap-secret-values.py \
            production observability grafana-secrets \
            GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD >/dev/null
          if [ "$app_drift" = true ] || [ "$app_marker_drift" = true ]; then
            app_reconciliation_drift=true
          else
            app_reconciliation_drift=false
          fi
          if [ "$grafana_drift" = true ] || [ "$grafana_marker_drift" = true ]; then
            grafana_reconciliation_drift=true
          else
            grafana_reconciliation_drift=false
          fi
          {
            printf 'app_secret_drift=%s\n' "$app_drift"
            printf 'grafana_secret_drift=%s\n' "$grafana_drift"
            printf 'app_reconciliation_drift=%s\n' "$app_reconciliation_drift"
            printf 'grafana_reconciliation_drift=%s\n' "$grafana_reconciliation_drift"
            printf 'app_secret_generation=%s\n' "$app_secret_generation"
            printf 'grafana_secret_generation=%s\n' "$grafana_secret_generation"
            printf 'app_secret_resource_version=%s\n' "$app_secret_resource_version"
            printf 'reconciliation_resource_version=%s\n' "$reconciliation_resource_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build candidate production release record
        run: |
          python3 scripts/smoke/release_state.py build-record \
            --environment production \
            --manifest "$RELEASE_MANIFEST" \
            --record "$RELEASE_RECORD"

      - name: Snapshot the current complete production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/smoke/release_state.py snapshot \
            --namespace "$NS" \
            --environment production \
            --artifact-name production-release-manifest \
            --artifact-filename production-release.yaml \
            --rollback-manifest "$ROLLBACK_MANIFEST" \
            --rollback-record "$ROLLBACK_RECORD"

      - name: Snapshot the current production application Secret
        if: steps.drift-guard.outputs.app_secret_drift == 'true'
        run: |
          ./scripts/preserve-kubernetes-secret.py snapshot \
            "$NS" mnema-secrets \
            '${{ steps.drift-guard.outputs.app_secret_resource_version }}' \
            "$ROLLBACK_APP_SECRET"

      - name: Mark the candidate mutation boundary
        id: mutation-start
        run: echo 'attempted=true' >> "$GITHUB_OUTPUT"

      - name: Ensure namespace exists
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/observability/00-namespace.yaml

      - name: Create/Update secret (mnema-secrets)
        id: app-secret-apply
        if: steps.drift-guard.outputs.app_secret_drift == 'true'
        run: |
          secret_names="AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN SMOKE_LOGIN SMOKE_TURNSTILE_BYPASS_KEY"
          # The approved resourceVersion makes this a fail-closed HTTP PUT.
          # shellcheck disable=SC2086 # Intentional expansion into key arguments.
          ./scripts/replace-kubernetes-secret-if-current.py \
            "$NS" mnema-secrets \
            '${{ steps.drift-guard.outputs.app_secret_resource_version }}' \
            $secret_names
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}

      - name: Create/Update Grafana dashboards ConfigMap
        run: |
          kubectl -n observability create configmap grafana-dashboards \
            --from-file=k8s/observability/dashboards \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests (main cluster)
        run: |
          kubectl apply -f k8s/cluster-issuers.yaml
          kubectl -n "$NS" apply -f k8s/postgres.yaml
          kubectl -n "$NS" apply -f k8s/redis.yaml
          kubectl -n "$NS" delete service mnema-ai-bridge --ignore-not-found=true
          kubectl -n "$NS" delete endpointslice \
            -l kubernetes.io/service-name=mnema-ai-bridge \
            --ignore-not-found=true
          kubectl apply -f k8s/observability/

      - name: Restart observability configuration consumers
        run: |
          kubectl -n observability rollout restart daemonset/alloy
          if [ '${{ steps.drift-guard.outputs.grafana_reconciliation_drift }}' = true ]; then
            kubectl -n observability patch deployment grafana --type=merge \
              -p '{"spec":{"template":{"metadata":{"annotations":{"mnema.app/secret-generation":"${{ steps.drift-guard.outputs.grafana_secret_generation }}"}}}}}'
          else
            kubectl -n observability rollout restart deployment/grafana
          fi

      - name: Apply complete application release once
        id: apply
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          kubectl apply -f "$RELEASE_MANIFEST"
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Reconcile application Secret consumers
        if: steps.drift-guard.outputs.app_reconciliation_drift == 'true'
        run: |
          for consumer in mnema-auth mnema-user mnema-core mnema-media mnema-import; do
            kubectl -n "$NS" patch deployment "$consumer" --type=merge \
              -p '{"spec":{"template":{"metadata":{"annotations":{"mnema.app/secret-generation":"${{ steps.drift-guard.outputs.app_secret_generation }}"}}}}}'
          done

      - name: Verify service rollouts (sequential)
        id: rollout
        continue-on-error: true
        run: |
          set -euo pipefail

          wait_rollout() {
            local deploy_name="$1"
            local timeout="$2"
            local attempts=3

            for attempt in $(seq 1 "$attempts"); do
              if kubectl -n "$NS" rollout status "deploy/${deploy_name}" --timeout="${timeout}"; then
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "rollout status failed for ${deploy_name}, retrying (${attempt}/${attempts})..."
                sleep 10
              fi
            done

            return 1
          }

          wait_rollout mnema-frontend 600s
          wait_rollout mnema-auth     1200s
          wait_rollout mnema-user     1200s
          wait_rollout mnema-core     1200s
          wait_rollout mnema-media    1800s
          wait_rollout mnema-import   1800s

      - name: Verify observability rollouts
        id: observability
        continue-on-error: true
        run: |
          kubectl -n observability rollout status daemonset/alloy --timeout=600s
          kubectl -n observability rollout status deployment/grafana --timeout=600s

      - name: Run production black-box release smoke
        id: smoke
        if: ${{ steps.rollout.outcome == 'success' && steps.observability.outcome == 'success' }}
        continue-on-error: true
        env:
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment production \
            --public-url https://mnema.app \
            --auth-url https://auth.mnema.app \
            --expected-release-sha "$RELEASE_SHA" \
            --timeout-seconds 300 \
            --report "$SMOKE_REPORT"

      - name: Record successful Secret reconciliation generations
        id: reconciliation
        if: ${{ steps.rollout.outcome == 'success' && steps.observability.outcome == 'success' && steps.smoke.outcome == 'success' }}
        continue-on-error: true
        env:
          APP_SECRET_GENERATION: ${{ steps.drift-guard.outputs.app_secret_generation }}
          GRAFANA_SECRET_GENERATION: ${{ steps.drift-guard.outputs.grafana_secret_generation }}
          RECONCILIATION_RESOURCE_VERSION: ${{ steps.drift-guard.outputs.reconciliation_resource_version }}
        run: |
          if [ -n "$RECONCILIATION_RESOURCE_VERSION" ]; then
            {
              printf '%s\n' \
                'apiVersion: v1' \
                'kind: ConfigMap' \
                'metadata:' \
                '  name: mnema-secret-reconciliation' \
                "  namespace: ${NS}" \
                "  resourceVersion: \"${RECONCILIATION_RESOURCE_VERSION}\"" \
                'data:' \
                "  applicationGeneration: \"${APP_SECRET_GENERATION}\"" \
                "  grafanaGeneration: \"${GRAFANA_SECRET_GENERATION}\""
            } | kubectl replace -f -
          else
            kubectl -n "$NS" create configmap mnema-secret-reconciliation \
              --from-literal="applicationGeneration=${APP_SECRET_GENERATION}" \
              --from-literal="grafanaGeneration=${GRAFANA_SECRET_GENERATION}"
          fi

      - name: Record successful complete production release
        id: record
        if: ${{ steps.reconciliation.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 scripts/smoke/release_state.py record \
            --namespace "$NS" \
            --manifest "$RELEASE_MANIFEST" \
            --record "$RELEASE_RECORD"

      - name: Upload verified production release record
        if: ${{ steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: production-release-record-${{ github.run_id }}
          path: ${{ env.RELEASE_RECORD }}
          if-no-files-found: error
          retention-days: 90

      - name: Collect sanitized production diagnostics
        if: ${{ always() && (failure() || steps.rollout.outcome != 'success' || steps.observability.outcome != 'success' || steps.smoke.outcome != 'success' || steps.reconciliation.outcome != 'success' || steps.record.outcome != 'success') }}
        continue-on-error: true
        run: |
          python3 scripts/smoke/collect_diagnostics.py \
            --namespace "$NS" \
            --output "$DIAGNOSTICS_DIR" \
            --smoke-report "$SMOKE_REPORT"

      - name: Restore the previous production application Secret
        if: ${{ always() && steps.app-secret-apply.outcome == 'success' && (steps.rollout.outcome != 'success' || steps.observability.outcome != 'success' || steps.smoke.outcome != 'success' || steps.reconciliation.outcome != 'success' || steps.record.outcome != 'success') && env.AUTO_ROLLBACK_ENABLED == 'true' }}
        env:
          AUTH_ISSUER: ${{ secrets.PROD_AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.PROD_AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.PROD_AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.PROD_AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.PROD_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.PROD_TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.PROD_GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PROD_GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.PROD_YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.PROD_YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.PROD_AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.PROD_MEDIA_INTERNAL_TOKEN }}
          CORE_INTERNAL_TOKEN: ${{ secrets.PROD_CORE_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.PROD_USER_INTERNAL_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
        run: |
          secret_names="AUTH_ISSUER AUTH_ISSUER_URI AUTH_JWT_PUBLIC_KEY AUTH_JWT_PRIVATE_KEY TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET YANDEX_CLIENT_ID YANDEX_CLIENT_SECRET POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_BUCKET_NAME MEDIA_INTERNAL_TOKEN CORE_INTERNAL_TOKEN USER_INTERNAL_TOKEN SMOKE_LOGIN SMOKE_TURNSTILE_BYPASS_KEY"
          # shellcheck disable=SC2086 # Intentional expansion into key arguments.
          ./scripts/preserve-kubernetes-secret.py restore \
            "$NS" mnema-secrets "$ROLLBACK_APP_SECRET" $secret_names

      - name: Roll back failed production candidate
        id: rollback
        if: ${{ always() && steps.mutation-start.outputs.attempted == 'true' && (steps.rollout.outcome != 'success' || steps.observability.outcome != 'success' || steps.smoke.outcome != 'success' || steps.reconciliation.outcome != 'success' || steps.record.outcome != 'success') && env.AUTO_ROLLBACK_ENABLED == 'true' }}
        run: |
          python3 scripts/smoke/release_state.py rollback \
            --namespace "$NS" \
            --rollback-manifest "$ROLLBACK_MANIFEST" \
            --rollback-record "$ROLLBACK_RECORD"
          ./scripts/reconcile-kubernetes-secret-consumers.sh \
            "$NS" mnema-secrets \
            mnema-auth mnema-user mnema-core mnema-media mnema-import

      - name: Verify production rollback rollouts
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        run: |
          set -euo pipefail

          wait_rollout() {
            local deploy_name="$1"
            local timeout="$2"
            local attempts=3

            for attempt in $(seq 1 "$attempts"); do
              if kubectl -n "$NS" rollout status "deploy/${deploy_name}" --timeout="${timeout}"; then
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "rollback status failed for ${deploy_name}, retrying (${attempt}/${attempts})..."
                sleep 10
              fi
            done

            return 1
          }

          wait_rollout mnema-frontend 600s
          wait_rollout mnema-auth     1200s
          wait_rollout mnema-user     1200s
          wait_rollout mnema-core     1200s
          wait_rollout mnema-media    1800s
          wait_rollout mnema-import   1800s

      - name: Verify complete production rollback
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          SMOKE_TURNSTILE_BYPASS_KEY: ${{ secrets.PROD_SMOKE_TURNSTILE_BYPASS_KEY }}
        run: |
          python3 scripts/smoke/release_smoke.py \
            --environment production-rollback \
            --public-url https://mnema.app \
            --auth-url https://auth.mnema.app \
            --expected-release-sha "${{ steps.rollback.outputs.release_id }}" \
            --timeout-seconds 300 \
            --report "$ROLLBACK_SMOKE_REPORT"

      - name: Upload production failure evidence
        if: ${{ always() && (failure() || steps.rollout.outcome != 'success' || steps.observability.outcome != 'success' || steps.smoke.outcome != 'success' || steps.reconciliation.outcome != 'success' || steps.record.outcome != 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: production-release-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.DIAGNOSTICS_DIR }}
            ${{ env.SMOKE_REPORT }}
            ${{ env.ROLLBACK_SMOKE_REPORT }}
            ${{ env.ROLLBACK_RECORD }}
          if-no-files-found: warn
          retention-days: 30

      - name: Fail rejected production candidate
        if: ${{ always() && (steps.rollout.outcome != 'success' || steps.observability.outcome != 'success' || steps.smoke.outcome != 'success' || steps.reconciliation.outcome != 'success' || steps.record.outcome != 'success') }}
        run: |
          echo '::error::Production candidate failed release verification; rollback evidence is attached when enabled.'
          exit 1
