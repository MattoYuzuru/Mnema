name: Production Deploy

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact tested and built main revision to deploy
        required: true
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    environment:
      name: prod
      url: https://mnema.app
    env:
      NS: prod
      KUBECONFIG: ${{ github.workspace }}/kubeconfig-main
      RELEASE_MANIFEST: ${{ github.workspace }}/production-release.yaml
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Download complete release manifest
        uses: actions/download-artifact@v8
        with:
          name: production-release-manifest
          path: ${{ github.workspace }}

      - name: Verify release artifact integrity
        working-directory: ${{ github.workspace }}
        run: sha256sum --check production-release.yaml.sha256

      - name: Reject a stale release
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::error::Refusing stale release ${RELEASE_SHA}; current main is ${current_main}"
            exit 1
          fi

      - name: Write kubeconfig (main cluster)
        run: echo "${KUBECONFIG_B64}" | base64 -d > "$KUBECONFIG"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: Ensure namespace exists
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/observability/00-namespace.yaml

      - name: Create/Update secret (mnema-secrets)
        run: |
          AUTH_JWT_PUBLIC_KEY_B64=$(printf '%s' "$AUTH_JWT_PUBLIC_KEY" | base64 | tr -d '\n')
          AUTH_JWT_PRIVATE_KEY_B64=$(printf '%s' "$AUTH_JWT_PRIVATE_KEY" | base64 | tr -d '\n')
          CURRENT_USER_INTERNAL_TOKEN_B64=$(kubectl -n "$NS" get secret mnema-secrets -o jsonpath='{.data.USER_INTERNAL_TOKEN}' 2>/dev/null || true)
          if [ -n "${USER_INTERNAL_TOKEN:-}" ]; then
            USER_INTERNAL_TOKEN_VALUE="$USER_INTERNAL_TOKEN"
          elif [ -n "$CURRENT_USER_INTERNAL_TOKEN_B64" ]; then
            USER_INTERNAL_TOKEN_VALUE=$(printf '%s' "$CURRENT_USER_INTERNAL_TOKEN_B64" | base64 -d)
          else
            USER_INTERNAL_TOKEN_VALUE=$(openssl rand -hex 24)
          fi
          cat <<YAML | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: mnema-secrets
            namespace: ${NS}
          type: Opaque
          data:
            AUTH_JWT_PUBLIC_KEY: "${AUTH_JWT_PUBLIC_KEY_B64}"
            AUTH_JWT_PRIVATE_KEY: "${AUTH_JWT_PRIVATE_KEY_B64}"
          stringData:
            AUTH_ISSUER: "${AUTH_ISSUER}"
            AUTH_ISSUER_URI: "${AUTH_ISSUER_URI}"
            TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY}"
            TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY}"
            GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
            GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
            GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
            GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
            YANDEX_CLIENT_ID: "${YANDEX_CLIENT_ID}"
            YANDEX_CLIENT_SECRET: "${YANDEX_CLIENT_SECRET}"
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_USER: "${POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            AWS_REGION: "${AWS_REGION}"
            AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
            AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
            AWS_BUCKET_NAME: "${AWS_BUCKET_NAME}"
            MEDIA_INTERNAL_TOKEN: "${MEDIA_INTERNAL_TOKEN}"
            USER_INTERNAL_TOKEN: "${USER_INTERNAL_TOKEN_VALUE}"
          YAML
        env:
          AUTH_ISSUER: ${{ secrets.AUTH_ISSUER }}
          AUTH_ISSUER_URI: ${{ secrets.AUTH_ISSUER_URI }}
          AUTH_JWT_PUBLIC_KEY: ${{ secrets.AUTH_JWT_PUBLIC_KEY }}
          AUTH_JWT_PRIVATE_KEY: ${{ secrets.AUTH_JWT_PRIVATE_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          MEDIA_INTERNAL_TOKEN: ${{ secrets.MEDIA_INTERNAL_TOKEN }}
          USER_INTERNAL_TOKEN: ${{ secrets.USER_INTERNAL_TOKEN }}

      - name: Create/Update secret (grafana-secrets)
        run: |
          cat <<YAML | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-secrets
            namespace: observability
          type: Opaque
          stringData:
            GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
            GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
          YAML
        env:
          GF_SECURITY_ADMIN_USER: ${{ secrets.GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}

      - name: Create/Update Grafana dashboards ConfigMap
        run: |
          kubectl -n observability create configmap grafana-dashboards \
            --from-file=k8s/observability/dashboards \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests (main cluster)
        run: |
          kubectl apply -f k8s/cluster-issuers.yaml
          kubectl -n "$NS" apply -f k8s/postgres.yaml
          kubectl -n "$NS" apply -f k8s/redis.yaml
          kubectl -n "$NS" delete service mnema-ai-bridge --ignore-not-found=true
          kubectl -n "$NS" delete endpointslice \
            -l kubernetes.io/service-name=mnema-ai-bridge \
            --ignore-not-found=true
          kubectl apply -f k8s/observability/

      - name: Restart observability pods (config reload)
        run: |
          kubectl -n observability rollout restart daemonset/alloy
          kubectl -n observability rollout restart deployment/grafana

      - name: Preview complete application release
        run: |
          kubectl apply --dry-run=server -f "$RELEASE_MANIFEST" >/dev/null

          set +e
          kubectl diff -f "$RELEASE_MANIFEST"
          diff_status=$?
          set -e

          if [ "$diff_status" -gt 1 ]; then
            echo "::error::Unable to preview the complete release manifest"
            exit "$diff_status"
          fi

      - name: Apply complete application release once
        run: kubectl apply -f "$RELEASE_MANIFEST"

      - name: Verify service rollouts (sequential)
        run: |
          set -euo pipefail

          wait_rollout() {
            local deploy_name="$1"
            local timeout="$2"
            local attempts=3

            for attempt in $(seq 1 "$attempts"); do
              if kubectl -n "$NS" rollout status "deploy/${deploy_name}" --timeout="${timeout}"; then
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "rollout status failed for ${deploy_name}, retrying (${attempt}/${attempts})..."
                sleep 10
              fi
            done

            return 1
          }

          wait_rollout mnema-frontend 600s
          wait_rollout mnema-auth     1200s
          wait_rollout mnema-user     1200s
          wait_rollout mnema-core     1200s
          wait_rollout mnema-media    1800s
          wait_rollout mnema-import   1800s
